        }).join('') + '</div></div>';
      out += '<p class="hint">Four is a gentle warm-up; six is a proper afternoon. The app deals criteria cards at random and secretly sets each one, guaranteeing a single answer with <em>no redundant card</em> — same standard as the puzzle book.</p>';
    } else {
      out += '<div class="field"><label>Criteria cards ' +
        '<span style="float:right;color:var(--brand-deep)">' + st.chosen.length + ' selected</span></label>' +
        '<div class="card-picker">' +
        DECK.cards.map(function (c) {
          var on = st.chosen.indexOf(c.id) !== -1;
          return '<button type="button" class="card-chip" data-action="pick-card" data-id="' + c.id + '" ' +
            'aria-pressed="' + on + '" title="' + h(c.description || c.title) + '">' + c.id + '</button>';
        }).join('') +
        '</div></div>';

      if (st.chosen.length) {
        out += '<div class="field"><label>Selected</label><div class="hint" style="font-family:var(--font-num);font-size:12.5px">' +
          st.chosen.map(function (id) {
            return '<div style="padding:3px 0"><b style="color:var(--brand-deep)">#' + id + '</b> — ' + h(DECK.get(id).title) + '</div>';
          }).join('') + '</div></div>';
      }

      if (st.mode === 'design') {
        out += '<p class="hint">Designer mode lets you set each card yourself — use it to rebuild a puzzle you already know the answer to. <em>Only open this if you are not the one solving.</em></p>';
        st.chosen.forEach(function (id, i) {
          var card = DECK.get(id);
          out += '<div class="field"><label>' + LETTERS[i] + ' — card ' + id + '</label>' +
            '<select class="input" data-action="design-variant" data-slot="' + i + '">' +
            card.verifiers.map(function (v, vi) {
              var sel = (st.designVariants[id] || 0) === vi ? ' selected' : '';
              return '<option value="' + vi + '"' + sel + '>' + h(v.text) + '</option>';
            }).join('') + '</select></div>';
        });
      } else {
        out += '<p class="hint">Pick 4–6 card numbers straight off the cards in your box. The app secretly chooses which option each one is set to, so nobody — including you — knows the answer.</p>';
      }
    }

    if (st.message) {
      out += '<div class="status-line' + (st.message.bad ? ' bad' : '') + '">' + h(st.message.text) + '</div>';
    }

    out += '<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-primary" data-action="generate"' + (st.busy ? ' disabled' : '') + '>' +
      (st.busy ? 'Building…' : 'Start the machine') + '</button>' +
      (st.mode === 'official' ? '<button class="btn btn-ghost" data-action="clear-official">Clear</button>' :
        (st.mode !== 'random' && st.chosen.length ? '<button class="btn btn-ghost" data-action="clear-cards">Clear</button>' : '')) +
      '</div>';

    out += '</div></section>';

    /* ---- join ---- */
    out += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Join a machine</h3></div><div class="panel-body">' +
      '<div class="field"><label>Puzzle code</label>' +
      '<input class="input code-input" id="join-code" placeholder="XXXXX-XXXXX-XXXX" autocomplete="off" spellcheck="false" value="' + h(st.joinCode || '') + '"></div>' +
      '<button class="btn btn-primary" data-action="join">Load puzzle</button>' +
      (S.setup.joinError ? '<div class="status-line bad">' + h(S.setup.joinError) + '</div>' : '') +
      '<div class="tape" style="margin:20px -18px"></div>' +
      '<p class="hint">Paste the code a friend read out, or just open the link they sent. Everyone gets the same cards, the same hidden settings and the same answer — you each keep your own notes.</p>' +
      '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-sm btn-ghost" data-action="rules">How it plays</button>' +
      '<button class="btn btn-sm btn-ghost" data-action="index">Card index</button>' +
      '</div>' +
      '</div></section>';

    out += '</div></div>';
    return out;
  }

  function seg(mode, label, active) {
    return '<button type="button" data-action="mode" data-mode="' + mode + '" aria-pressed="' + (active === mode) + '">' + label + '</button>';
  }

  /* ================================================================= GAME */

  function viewGame() {
    var out = '<div class="game">';
    out += viewStrip();
    if (S.puzzle.relaxed === 'redundant') {
      out += '<div class="status-line" style="margin:0">Heads up: with these particular cards, no setting made every ' +
        'card matter — so one verifier here is redundant, and the answer can be found without it. ' +
        'Don’t lean on the “every card must count” rule for this one.</div>';
    }
    out += '<section class="rack">' + S.puzzle.cardIds.map(viewVerifier).join('') + '</section>';
    out += '<div class="lower">' + viewConsole() + (isCold() ? viewCold() : viewLog()) + '</div>';
    if (isCold()) out += viewWorksheet();
    out += '</div>';
    return out;
  }

  /* How many options are still standing across the whole rack, counting only
     the ones the player has not crossed off. Their own pencil work — it gives
     nothing away. */
  function optionsLeft() {
    var live = 0, total = 0;
    S.puzzle.cardIds.forEach(function (id, slot) {
      var struck = S.notes[slot] || {};
      DECK.get(id).verifiers.forEach(function (v, vi) {
        total++;
        if (!struck[vi]) live++;
      });
    });
    return live + ' / ' + total;
  }

  function viewStrip() {
    var used = S.rounds.length;
    return '<dl class="strip">' +
      (isCold()
        ? '<div class="strip-cell"><dt>Guesses</dt><dd>' + S.attempts.length + '</dd></div>'
        : '<div class="strip-cell"><dt>Rounds used</dt><dd>' + used + '</dd></div>') +
      '<div class="strip-cell"><dt>Verifiers</dt><dd>' + S.puzzle.cardIds.length + '</dd></div>' +
      (S.finished
        ? '<div class="strip-cell"><dt>Result</dt><dd style="color:' +
          (S.finished.win ? 'var(--brand-deep)' : 'var(--fail)') + '">' +
          (S.finished.win ? 'Solved' : 'Missed') + '</dd></div>'
        : isCold()
          /* There are no tests to count here. What a player is actually
             whittling down is the options, so count those instead. */
          ? '<div class="strip-cell"><dt>Options left</dt><dd>' + optionsLeft() + '</dd></div>'
          : '<div class="strip-cell"><dt>Tests this round</dt><dd>' + testsThisRound() + ' / 3</dd></div>') +
      '<div class="strip-cell wide"><dt>' +
        (S.puzzle.official ? 'Puzzle code &middot; imported puzzle' : 'Puzzle code') +
        '</dt><dd>' + h(S.shareCode) + '</dd></div>' +
      '</dl>';
  }

  function viewVerifier(cardId, slot) {
    var card = DECK.get(cardId);
    var round = activeRound();
    var test = round ? round.tests.filter(function (t) { return t.slot === slot; })[0] : null;
    var auto = autoStruck();
    var open = notesOpen(slot);
    var struck = S.notes[slot] || {};
    var done = S.finished;

    var cls = 'verifier';
    if (test) cls += test.answer ? ' is-yes' : ' is-no';
    if (done) cls += ' is-solved';
    if (S.freshGame) cls += ' stagger';

    var remaining = card.verifiers.filter(function (v, vi) {
      return !struck[vi] && !(auto && auto[slot][vi]);
    }).length;

    var out = '<article class="' + cls + '" style="animation-delay:' + (slot * 70) + 'ms">';
    out += '<div class="verifier-top">' +
      '<div class="verifier-letter">' + LETTERS[slot] + '</div>' +
      '<div class="verifier-no">card<b>' + cardId + '</b></div>' +
      '<div class="lamp ' + (test ? (test.answer ? 'yes' : 'no') : '') + '"></div>' +
      '</div>';

    out += '<div class="verifier-art">' + art(VIS.cards[cardId], 'lg') + '</div>';
    out += '<div class="verifier-question">' + h(card.description || card.title) + '</div>';

    out += '<div class="verifier-foot">';
    if (isCold()) {
      /* nothing to ask — the options list is the whole working surface */
    } else if (done) {
      out += '<div class="test-result revealed">Revealed below</div>';
    } else if (test) {
      out += '<div class="test-result ' + (test.answer ? 'yes' : 'no') +
        (S.justTested === slot ? ' fresh' : '') + '">' +
        (test.answer ? '&#10003; passes' : '&#10007; fails') + '</div>';
    } else {
      var full = round && round.tests.length >= 3;
      out += '<button class="btn btn-sm test-btn" data-action="test" data-slot="' + slot + '"' +
        (full ? ' disabled title="Three tests already used this round"' : '') + '>Test ' + LETTERS[slot] + '</button>';
    }

    out += '<button class="notes-toggle" data-action="notes" data-slot="' + slot + '">' +
      '<span>' + (open ? '&#9662; options' : '&#9656; options') + '</span>' +
      '<span class="count">' + remaining + '/' + card.verifiers.length + '</span></button>';

    if (open) {
      var slotCard = cardId;
      out += '<div class="variants">' + card.verifiers.map(function (v, vi) {
        var c = 'variant';
        if (done && S.puzzle.variants[slot] === vi) c += ' revealed';
        else if (struck[vi]) c += ' struck';
        else if (auto && auto[slot][vi]) c += ' auto-struck';
        var mark = (done && S.puzzle.variants[slot] === vi) ? '&#10003;'
          : (struck[vi] ? '&#10007;' : (auto && auto[slot][vi] ? '&#8722;' : ''));
        return '<button class="' + c + '" data-action="strike" data-slot="' + slot + '" data-vi="' + vi + '">' +
          '<span class="mark">' + mark + '</span><span class="variant-body">' +
          '<span>' + h(v.text) + '</span>' + art(VIS.options[slotCard][vi], 'sm') + '</span></button>';
      }).join('') + '</div>';
    }

    out += '</div></article>';
    return out;
  }

  function viewConsole() {
    var locked = isCold() ? !!S.finished : (roundLocked() || !!S.finished);
    var used = testsThisRound();

    var out = '<section class="panel"><div class="panel-head"><h3 class="panel-title">' +
      (isCold() ? 'Your answer' : 'Proposal') + '</h3>' +
      (isCold() ? '' : '<div class="tests-left">' + [0, 1, 2].map(function (i) {
        return '<span class="pip' + (i < used ? ' used' : '') + '"></span>';
      }).join('') + '<span>tests</span></div>') + '</div><div class="panel-body">';

    out += '<div class="proposal-readout">' + CHANNELS.map(function (ch, i) {
      return '<div class="readout-digit ' + ch.key + '">' + glyph(ch.shape, ch.key) +
        '<span class="num">' + S.proposal[i] + '</span></div>';
    }).join('') + '</div>';

    out += '<div class="dials">' + CHANNELS.map(function (ch, i) {
      return '<div class="dial-row ' + ch.key + '">' +
        '<div class="dial-label">' + glyph(ch.shape, ch.key) + '<span>' + ch.name + '</span></div>' +
        '<div class="dial-keys">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<button class="key" data-action="dial" data-ch="' + i + '" data-n="' + n + '"' +
            ' aria-pressed="' + (S.proposal[i] === n) + '"' + (locked ? ' disabled' : '') +
            ' aria-label="' + ch.name + ' ' + n + '">' + n + '</button>';
        }).join('') + '</div></div>';
    }).join('') + '</div>';

    out += '<div class="console-actions">';
    if (isCold()) {
      /* No tests to spend and no rounds to end, so this panel offers exactly one
         button — no "Announce answer" alongside it. */
      if (S.finished) {
        out += '<button class="btn btn-primary" data-action="reveal">See the solution sheet</button>';
      } else {
        out += '<button class="btn btn-primary" data-action="announce">Submit this code</button>';
        out += '<p class="hint" style="font-size:13px">No testing in this mode. When the card ' +
          'list leaves only one possible code, enter it.</p>';
      }
      out += '</div></div></section>';
      return out;
    }
    if (S.finished) {
      out += '<button class="btn btn-primary" data-action="reveal">See the solution sheet</button>';
    } else if (locked) {
      out += '<button class="btn btn-primary" data-action="next-round">Next round &rarr;</button>';
      out += '<p class="hint" style="font-size:13px">You have tested this proposal. Start a new round to change the dials — that is what costs you.</p>';
    } else {
      out += '<p class="hint" style="font-size:13px">Set the three dials, then test the proposal against up to three verifiers. Changing the dials is free until you test.</p>';
    }
    out += '<div class="row"><button class="btn" data-action="announce"' + (S.finished ? ' disabled' : '') + '>Announce answer</button></div>';
    out += '</div>';

    out += '</div></section>';
    return out;
  }

  /*
   * A scratchpad of all 125 codes. This mode withholds the candidate assist on
   * purpose — it would print the answer — so the crossing-off has to be the
   * player's own work. Grouped into five blocks by the blue digit, which is
   * how you scan them once a criterion pins blue down.
   */
  function viewWorksheet() {
    var struck = 0;
    for (var k in S.grid) if (S.grid[k]) struck++;

    var out = '<section class="panel worksheet">' +
      '<button class="worksheet-head" data-action="grid-toggle" aria-expanded="' + S.gridOpen + '">' +
      '<span class="panel-title">Worksheet</span>' +
      '<span class="worksheet-meta"><b>' + (125 - struck) + '</b> of 125 left' +
      '<span class="worksheet-caret">' + (S.gridOpen ? '&#9662;' : '&#9656;') + '</span></span>' +
      '</button>';

    if (!S.gridOpen) return out + '</section>';

    out += '<div class="panel-body">' +
      '<p class="hint" style="margin:0 0 14px">Cross off codes as your reasoning rules them ' +
      'out. Nothing here is filled in or checked for you — it is a pencil, not a hint.</p>' +
      '<div class="worksheet-grid">';

    for (var b = 1; b <= 5; b++) {
      out += '<div class="ws-block"><div class="ws-head">' + glyph('triangle', 'blue') +
        '<span>blue ' + b + '</span></div><div class="ws-cells">';
      for (var y = 1; y <= 5; y++) {
        for (var p = 1; p <= 5; p++) {
          var i = E.codeIndex(b, y, p);
          out += '<button class="ws-cell' + (S.grid[i] ? ' off' : '') +
            '" data-action="grid-mark" data-i="' + i + '" ' +
            'aria-pressed="' + (!!S.grid[i]) + '" aria-label="blue ' + b + ', yellow ' + y +
            ', purple ' + p + '">' +
            '<span class="b">' + b + '</span><span class="y">' + y + '</span>' +
            '<span class="p">' + p + '</span></button>';
        }
      }
      out += '</div></div>';
    }
    out += '</div>';

    if (struck) {
      out += '<div style="margin-top:14px"><button class="btn btn-sm btn-ghost" ' +
        'data-action="grid-clear">Rub out ' + (struck === 1 ? 'the one mark' :
          'all ' + struck + ' marks') + '</button></div>';
    }
    return out + '</div></section>';
  }

  /* Derived from the cards, like coldness itself — so a shared puzzle shows
     the same label to whoever opens it. */
  function coldTier(pz) {
    var menus = pz.cardIds.filter(function (id) { return id > 25; }).length;
    if (!menus && pz.searchSpace <= 220 && (pz.survivors || 0) <= 20) return 'Gentle';
    if (menus >= 3 || pz.searchSpace >= 800) return 'Tough';
    return 'Standard';
  }

  function viewCold() {
    var pz = S.puzzle;
    var out = '<section class="panel"><div class="panel-head">' +
      '<h3 class="panel-title">No questions &middot; ' + coldTier(pz) + '</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="rules">Rules</button></div>' +
      '<div class="panel-body">';

    out += '<p class="hint" style="margin-top:0">Two rules hold for every Turing Machine ' +
      'puzzle, and here they are all you get:</p>' +
      '<ol class="cold-rules">' +
      '<li>Exactly <b>one</b> of the 125 codes satisfies every verifier.</li>' +
      '<li>No verifier is idle — drop any one of them and the answer stops being unique.</li>' +
      '</ol>' +
      /* Dealt puzzles always have a single legal setting, but this mode is
         entered by *derivation* — a hand-picked or shared set can answer itself
         while still allowing several settings. Claiming "exactly one way" there
         sends the player hunting for something that is not there, so say which
         case they are actually in. */
      (pz.ways > 1
        ? '<p class="hint">For these ' + pz.cardIds.length + ' cards there are <b>' + pz.ways +
          '</b> ways to set them that satisfy both — but every one of them points at the ' +
          '<b>same code</b>. So the settings stay ambiguous and the code does not. Cross ' +
          'options off the lists above as you rule them out.</p>'
        : '<p class="hint">For these ' + pz.cardIds.length + ' cards there is <b>exactly one</b> way ' +
          'to set them that satisfies both. Find it, and the code falls out. Cross options off the ' +
          'lists above as you rule them out.</p>');

    /* Two different spaces, and they are easy to confuse: the 125 codes are
       the answers, while a "setting" is which option each card is secretly on.
       Show the multiplication so the second number explains itself. */
    var counts = pz.cardIds.map(function (id) { return DECK.get(id).verifiers.length; });
    out += '<div class="cold-facts">' +
      '<div><dt>Ways the cards could be set</dt><dd>' + (pz.searchSpace || 0).toLocaleString() + '</dd></div>' +
      '<div><dt>Of those, legal puzzles</dt><dd>' + (pz.ways || 1) + '</dd></div>' +
      '</div>' +
      '<p class="hint" style="font-size:12.5px;margin:8px 0 0">Each card is secretly set to ' +
      'one of its printed options, so the cards can be set ' + counts.join(' &times; ') + ' = <b>' +
      (pz.searchSpace || 0).toLocaleString() + '</b> ways. That is not the same as the ' +
      '<b>125</b> possible codes — every legal setting picks out exactly one of those. ' +
      (pz.ways > 1
        ? 'Only ' + pz.ways + ' of the ' + (pz.searchSpace || 0).toLocaleString() +
          ' settings are legal, and they all point at the same code.'
        : 'Exactly one of the ' + (pz.searchSpace || 0).toLocaleString() +
          ' settings is legal — find it and you have the code.') +
      '</p>';

    if (S.attempts.length) {
      out += '<div class="field" style="margin-top:18px"><label>Codes you have tried</label>' +
        '<div class="tried">' + S.attempts.map(function (a) {
          return '<span class="candidate' + (a.win ? '' : ' out') + '">' + codeHtml(a.code) + '</span>';
        }).join('') + '</div></div>';
    }

    if (S.finished && S.finished.gaveUp) {
      out += '<div class="status-line">You asked to see it — the settings are marked on the cards above.</div>';
    } else if (S.coldMiss) {
      out += '<div class="status-line bad">' + h(S.coldMiss) + '</div>';
    }

    if (!S.finished) {
      out += '<div style="margin-top:18px">' +
        '<button class="btn btn-sm btn-ghost" data-action="give-up">Show me the answer</button></div>';
    }

    return out + '</div></section>';
  }

  function viewLog() {
    var n = S.puzzle.cardIds.length;
    var out = '<section class="panel"><div class="panel-head"><h3 class="panel-title">Logbook</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="rules">Rules</button></div>';

    if (!S.rounds.length) {
      out += '<div class="empty-note">No rounds yet. The machine is warm and waiting.</div>';
    } else {
      out += '<div style="overflow-x:auto"><table class="log-table"><thead><tr>' +
        '<th>Round</th><th>Proposal</th>' +
        S.puzzle.cardIds.map(function (id, i) { return '<th>' + LETTERS[i] + '</th>'; }).join('') +
        '</tr></thead><tbody>';
      S.rounds.forEach(function (r, ri) {
        var isCurrent = ri === S.rounds.length - 1 && !S.finished;
        out += '<tr' + (isCurrent ? ' class="current"' : '') + '>' +
          '<td class="log-round">' + (r.final ? 'final' : String(ri + 1).padStart(2, '0')) + '</td>' +
          '<td>' + codeHtml(r.code) + '</td>';
        for (var i = 0; i < n; i++) {
          var t = r.tests.filter(function (x) { return x.slot === i; })[0];
          out += '<td>' + (t ? (t.answer ? '<span class="log-yes">&#10003;</span>' : '<span class="log-no">&#10007;</span>') : '<span class="log-empty">·</span>') + '</td>';
        }
        out += '</tr>';
      });
      out += '</tbody></table></div>';
    }

    out += '<div class="assist-bar"><span class="label">Assist</span><div class="seg" role="group">' +
      [['off', 'Off'], ['cross', 'Cross out'], ['solve', 'Show candidates']].map(function (o) {
        return '<button type="button" data-action="assist" data-v="' + o[0] + '" aria-pressed="' + (S.assist === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div></div>';

    if (S.assist === 'cross') {
      out += '<p class="hint" style="padding:0 18px 14px;font-size:13px">Options that contradict an answer you have already received are crossed out for you. Open a verifier’s <em>options</em> list to see them.</p>';
    }

    if (S.assist === 'solve') out += viewReplay();

    out += '</section>';
    return out;
  }

  /* Scrub back through the answers and watch the field narrow. */
  function viewReplay() {
    var trail = resultTrail();
    var steps = E.candidateTimeline(DECK, S.puzzle, trail, ensureLegal());
    var at = S.replayStep;
    if (at === null || at === undefined || at > steps.length - 1) at = steps.length - 1;

    var here = steps[at];
    var prev = at > 0 ? steps[at - 1] : null;
    var ev = at > 0 ? trail[at - 1] : null;

    var out = '<div class="replay">';

    /* The start chip shows even on an untouched board — it is where the replay
       begins, and seeing it there says the track will grow as answers land. */
    out += '<div class="replay-track">' +
        '<button class="replay-step' + (at === 0 ? ' on' : '') + '" data-action="replay" data-i="0">' +
        '<span class="rs-label">start</span><span class="rs-n">' + steps[0].codes.length + '</span></button>' +
        trail.map(function (t, i) {
          var st = steps[i + 1];
          var gone = steps[i].codes.length - st.codes.length;
          return '<button class="replay-step' + (at === i + 1 ? ' on' : '') +
            (t.answer ? ' yes' : ' no') + '" data-action="replay" data-i="' + (i + 1) + '" ' +
            'title="Round ' + t.round + ', ' + t.code.join(' ') + ' → verifier ' + LETTERS[t.verifierSlot] +
            (gone ? ', ruled out ' + gone : ', ruled out nothing') + '">' +
            '<span class="rs-label">' + (t.final ? 'end' : t.round) + '&middot;' + LETTERS[t.verifierSlot] +
            (t.answer ? ' &#10003;' : ' &#10007;') + '</span>' +
            '<span class="rs-n">' + st.codes.length + '</span></button>';
        }).join('') + '</div>';

    out += '<p class="replay-say">' + (ev
      ? 'Round ' + ev.round + ' &middot; you put ' + codeHtml(ev.code) + ' to verifier <b>' +
        LETTERS[ev.verifierSlot] + '</b> (card ' + S.puzzle.cardIds[ev.verifierSlot] + '), which said <b class="' +
        (ev.answer ? 'log-yes">&#10003; yes' : 'log-no">&#10007; no') + '</b>. ' +
        (prev.codes.length - here.codes.length
          ? 'That ruled out <b>' + (prev.codes.length - here.codes.length) + '</b> of ' + prev.codes.length + '.'
          : 'That ruled out nothing you did not already know.')
      : trail.length
        ? 'Before any answers, with these card numbers alone.'
        : 'Nothing tested yet — these are the codes the card numbers alone allow.') + '</p>';

    out += '<div class="candidates">';
    if (!here.codes.length) {
      out += '<span class="hint">No code fits those answers — check the log.</span>';
    } else {
      out += here.codes.map(function (code) {
        return '<span class="candidate">' + codeHtml(code) + '</span>';
      }).join('');
      if (prev) {
        var live = {};
        here.codes.forEach(function (c) { live[c.join('')] = 1; });
        out += prev.codes.filter(function (c) { return !live[c.join('')]; }).map(function (code) {
          return '<span class="candidate out">' + codeHtml(code) + '</span>';
        }).join('');
      }
    }
    out += '</div>';

    out += '<p class="hint" style="padding:8px 20px 16px;font-size:13px">' +
      here.codes.length + ' code' + (here.codes.length === 1 ? '' : 's') +
      (at === steps.length - 1 ? ' still standing.' : ' standing at that point.') +
      (prev && prev.codes.length > here.codes.length ? ' Struck-through ones fell to this answer.' : '') +
      '</p>';

    return out + '</div>';
  }

  /* =============================================================== MODALS */

  function viewModal() {
    if (!S.modal) return '';
    var body = '';
    if (S.modal === 'rules') body = rulesModal();
    else if (S.modal === 'index') body = indexModal();
    else if (S.modal === 'announce') body = announceModal();
    else if (S.modal === 'reveal') body = revealModal();
    else if (S.modal === 'share') body = shareModal();
    else if (S.modal === 'ask') body = askModal();
    var fresh = S.shownModal !== S.modal ? ' fresh' : '';
    return '<div class="overlay' + fresh + '" data-action="overlay">' +
      '<div class="modal" role="dialog" aria-modal="true">' + body + '</div></div>';
  }

  function rulesModal() {
    return '<div class="panel-head"><h3 class="panel-title">How it plays</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="close">Close</button></div><div class="panel-body">' +
      '<p>A three-digit code is hiding: one <b style="color:var(--blue)">blue</b>, one <b style="color:var(--yellow)">yellow</b>, one <b style="color:var(--purple)">purple</b> digit, each from 1 to 5.</p>' +
      '<h3>A round</h3><ul>' +
      '<li>Set the three dials to a proposal.</li>' +
      '<li>Test that proposal against up to <b>three</b> verifiers. Each answers only ✓ or ✗ — does this proposal satisfy my criterion?</li>' +
      '<li>Cross options off each verifier’s list as you rule them out.</li>' +
      '<li>Start a new round to change the dials. Your score is the number of rounds — fewer is better.</li>' +
      '</ul>' +
      '<h3>Winning</h3>' +
      '<p>When you think you have it, hit <b>Announce answer</b>. Your code is put to every verifier at once. All ✓ and you have cracked it. Announcing spends a round, just as it does at the table.</p>' +
      '<h3>Playing together</h3>' +
      '<p>Share the puzzle code. Everyone runs their own board and their own notes — compare findings out loud, or race. Your progress is saved in this browser, so you can close the tab and come back.</p>' +
      '<h3>Assist</h3>' +
      '<p><em>Cross out</em> strikes the options your results have already disproved. <em>Show candidates</em> lists every code still standing. Both are legal deductions — they just save the pencil work.</p>' +
      '</div><div class="modal-actions"><button class="btn btn-primary" data-action="close">Got it</button></div>';
  }

  function indexModal() {
    return '<div class="panel-head"><h3 class="panel-title">Criteria card index</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="close">Close</button></div>' +
      '<div class="panel-body"><p style="margin-top:0">All 48 criteria cards, matching the numbers printed on your cards.</p>' +
      '<div class="reveal-list" style="padding:0">' + DECK.cards.map(function (c) {
        return '<div class="reveal-row"><div class="letter">' + c.id + '</div><div class="txt">' +
          h(c.description || c.title) +
          '<span class="index-art">' + art(VIS.cards[c.id], 'sm') + '</span>' +
          '<span class="card-ref">' + c.verifiers.length + ' options</span></div></div>';
      }).join('') + '</div></div>';
  }

  function announceModal() {
    return '<div class="panel-head"><h3 class="panel-title">Announce your answer</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="close">Close</button></div><div class="panel-body">' +
      '<p style="margin-top:0">Put this code to every verifier at once. This ends the game.</p>' +
      '<div class="reveal-code">' + CHANNELS.map(function (ch, i) {
        return '<div class="readout-digit ' + ch.key + '">' + glyph(ch.shape, ch.key) +
          '<span class="num">' + S.proposal[i] + '</span></div>';
      }).join('') + '</div></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" data-action="close">Not yet</button>' +
      '<button class="btn btn-primary" data-action="confirm-announce">Submit answer</button></div>';
  }

  function revealModal() {
    var f = S.finished;
    var out = '<div class="verdict ' + (f.win ? 'win' : 'lose') + '">' +
      '<div class="seal">' + (f.win ? '&#10003;' : '&#10007;') + '</div>' +
      '<h2>' + (f.win ? 'Cracked it.' : 'Not this time.') + '</h2>' +
      '<p class="sub">' + (f.win
        ? (f.cold
            ? 'Reasoned out with no questions asked' +
              (f.rounds > 1 ? ', on guess ' + f.rounds + '.' : ', first guess.')
            : 'Solved in ' + f.rounds + ' round' + (f.rounds === 1 ? '' : 's') +
              ', the announcement included.')
        : f.gaveUp
          ? 'You asked to see it' + (f.rounds
              ? ', after ' + f.rounds + ' guess' + (f.rounds === 1 ? '' : 'es') + '. '
              : '. ') + 'The machine was set to:'
          : 'You proposed ' + f.attempt.join(' ') + '. The machine was set to:') + '</p>' +
      '<div class="reveal-code">' + CHANNELS.map(function (ch, i) {
        return '<div class="readout-digit ' + ch.key + '">' + glyph(ch.shape, ch.key) +
          '<span class="num">' + S.puzzle.solution[i] + '</span></div>';
      }).join('') + '</div></div>';

    out += '<div class="reveal-list">' + S.puzzle.cardIds.map(function (id, i) {
      var v = DECK.get(id).verifiers[S.puzzle.variants[i]];
      return '<div class="reveal-row"><div class="letter">' + LETTERS[i] + '</div><div class="txt">' +
        h(v.text) + art(VIS.options[id][S.puzzle.variants[i]], 'sm') +
        '<span class="card-ref">criteria card ' + id + '</span></div></div>';
    }).join('') + '</div>';

    out += '<div class="modal-actions">' +
      '<button class="btn btn-ghost" data-action="close">Back to board</button>' +
      '<button class="btn btn-primary" data-action="new-game">New machine</button></div>';
    return out;
  }

  function askModal() {
    var q = S.ask || {};
    return '<div class="panel-head"><h3 class="panel-title">' + h(q.title || 'Are you sure?') + '</h3></div>' +
      '<div class="panel-body"><p style="margin:0">' + h(q.body || '') + '</p></div>' +
      '<div class="modal-actions">' +
      '<button class="btn btn-ghost" data-action="close">' + h(q.cancel || 'Cancel') + '</button>' +
      '<button class="btn btn-primary" data-action="ask-yes">' + h(q.ok || 'Yes') + '</button></div>';
  }

  function shareModal() {
    var url = shareUrl();
    return '<div class="panel-head"><h3 class="panel-title">Share this machine</h3>' +
      '<button class="btn btn-sm btn-ghost" data-action="close">Close</button></div><div class="panel-body">' +
      '<div class="field"><label>Puzzle code — safe to read aloud</label>' +
      '<input class="input code-input" id="share-code" readonly value="' + h(S.shareCode) + '"></div>' +
      '<div class="field"><label>Or send the link</label>' +
      '<input class="input" id="share-url" readonly value="' + h(url) + '" style="font-size:12px"></div>' +
      '<p class="hint">The code carries the cards <em>and</em> their hidden settings, so everyone solves the identical machine. It does not spoil anything — you cannot read the answer out of it.</p>' +
      '</div><div class="modal-actions">' +
      '<button class="btn" data-action="copy" data-what="code">Copy code</button>' +
      '<button class="btn btn-primary" data-action="copy" data-what="url">Copy link</button></div>';
  }

  function shareUrl() {
    return location.origin + location.pathname + location.search + '#p=' + S.shareCode.replace(/-/g, '');
  }

  /* =============================================================== RENDER */

  function render() {
    var root = document.getElementById('root');
    var out = '';

    out += '<header class="masthead"><div class="wordmark">' +
      '<h1>Turing Machine</h1><span class="rule"></span>' +
      '<span class="tag">' + (S.screen !== 'game' ? 'set up a session'
        : S.finished ? (S.finished.win ? 'solved' : 'game over')
        : 'session in progress') + '</span>' +
      '</div><div class="masthead-tools">';
    if (S.screen === 'game') {
      out += '<button class="btn btn-sm" data-action="share">Share code</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="index">Cards</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="quit">New machine</button>';
    } else {
      out += '<button class="btn btn-sm btn-ghost" data-action="rules">How it plays</button>';
    }
    out += '<button class="theme-toggle" data-action="theme" title="Switch to ' +
      (S.theme === 'dark' ? 'light' : 'dark') + ' theme" aria-label="Switch to ' +
      (S.theme === 'dark' ? 'light' : 'dark') + ' theme">' +
      (S.theme === 'dark' ? '&#9788;' : '&#9790;') + '</button>';
    out += '</div></header>';

    out += S.screen === 'setup' ? viewSetup() : viewGame();
    out += viewModal();
    if (S.toast) out += '<div class="toast">' + h(S.toast) + '</div>';

    // Every action rebuilds the whole screen, which throws keyboard focus back
    // to <body>. On the worksheet that means tabbing past 125 cells again after
    // each mark, so put the caret back on the control that was just used.
    var hold = focusKey(document.activeElement);

    root.innerHTML = out;

    if (hold && !S.modal) {
      var back = root.querySelector(hold);
      if (back) { try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); } }
    }
    S.freshGame = false;
    S.justTested = null;
    S.shownModal = S.modal;
  }

  /* A selector that finds the same control again after a re-render. Actions are
     told apart by whichever data-* the handlers read, so match on those. */
  function focusKey(el) {
    if (!el || el === document.body || !el.dataset || !el.dataset.action) return null;
    var d = el.dataset, key = '[data-action="' + d.action + '"]';
    ['slot', 'vi', 'i', 'k', 'ch', 'n', 'v', 'mode'].forEach(function (a) {
      if (d[a] !== undefined) key += '[data-' + a + '="' + d[a] + '"]';
    });
    return key;
  }

  /* ================================================================ ACTIONS */

  function startPuzzle(puzzle, opts) {
    // A share code carries only cards and settings. Whether the set answers
    // itself is a property of the cards, so derive it rather than encode it —
    // a friend joining gets the same mode without a flag in the code.
    if (puzzle.cold === undefined) {
      var cn = E.coldness(DECK, puzzle);
      puzzle.cold = cn.cold;
      puzzle.ways = cn.ways;
      puzzle.survivors = cn.survivors;
      puzzle.searchSpace = cn.searchSpace;
    }
    S.puzzle = puzzle;
    S.shareCode = E.encodePuzzle(puzzle);
    S.legal = null;
    S.rounds = [];
    S.notes = {};
    S.openNotes = {};
    S.finished = null;
    S.pendingRound = false;
    S.attempts = [];
    S.coldMiss = null;
    S.grid = {};
    S.gridOpen = false;
    S.proposal = [1, 1, 1];
    S.assist = 'off';
    S.focusChannel = 0;
    if (!(opts && opts.noRestore)) restore();
    S.screen = 'game';
    S.freshGame = true;
    // The hash is for sharing. It is NOT what we reload from: inside an
    // embedded frame the page comes back at its original src with the hash
    // gone, which used to drop the player back on the setup screen.
    try { history.replaceState(null, '', '#p=' + S.shareCode.replace(/-/g, '')); } catch (e) {}
    try { localStorage.setItem(LAST_KEY, S.shareCode); } catch (e) {}
    save();
    render();
  }

  function doGenerate() {
    var st = S.setup;
    st.message = null;

    if (st.mode === 'cold') {
      st.busy = true; render();
      setTimeout(function () {
        try {
          st.busy = false;
          startPuzzle(E.generateColdPuzzle(DECK, { count: st.count, difficulty: st.coldLevel }));
        } catch (err) {
          st.busy = false;
          st.message = { bad: true, text: 'Could not find a set that answers itself. Try again.' };
          render();
        }
      }, 30);
      return;
    }

    if (st.mode === 'official') {
      var pairs = [];
      for (var i = 0; i < st.official.length; i++) {
        var c = parseInt(st.official[i][0], 10);
        var v = parseInt(st.official[i][1], 10);
        if (!c || !v) {
          st.message = { bad: true, text: 'Fill in both numbers for verifier ' + LETTERS[i] + '.' };
          return render();
        }
        pairs.push({ cardId: c, verification: v });
      }
      try {
        startPuzzle(E.decodeOfficial(DECK, VERIF, pairs));
      } catch (err) {
        st.message = { bad: true, text: err.message };
        render();
      }
      return;
    }

    if (st.mode !== 'random' && (st.chosen.length < 4 || st.chosen.length > 6)) {
      st.message = { bad: true, text: 'Choose between 4 and 6 criteria cards — that is what the game supports.' };
      return render();
    }

    st.busy = true; render();

    setTimeout(function () {
      try {
        var puzzle;
        if (st.mode === 'design') {
          var variants = st.chosen.map(function (id) { return st.designVariants[id] || 0; });
          var check = E.checkAssignment(DECK, st.chosen.map(function (id, i) {
            return { cardId: id, variantIndex: variants[i] };
          }));
          if (!check.ok) {
            st.busy = false;
            st.message = { bad: true, text: check.reason === 'ambiguous'
              ? 'Those settings leave ' + check.count + ' possible codes — a puzzle needs exactly one.'
              : 'No code satisfies all of those at once.' };
            return render();
          }
          puzzle = {
            cardIds: st.chosen.slice(), variants: variants,
            solution: check.solution, redundant: check.redundant,
            relaxed: check.redundant ? 'redundant' : null
          };
        } else {
          puzzle = E.generatePuzzle(DECK, st.mode === 'random'
            ? { count: st.count }
            : { cardIds: st.chosen.slice() });
        }
        st.busy = false;
        startPuzzle(puzzle, { noRestore: false });
      } catch (err) {
        st.busy = false;
        st.message = { bad: true, text: err.code === 'NO_LEGAL_ASSIGNMENT'
          ? 'That set of cards cannot make a valid puzzle — no way to set them gives a single answer with every card mattering. Swap one out.'
          : 'Could not build a puzzle from those cards. Try a different mix.' };
        render();
      }
    }, 30);
  }

  function doJoin(codeStr) {
    S.setup.joinCode = codeStr == null ? '' : String(codeStr);
    try {
      var puzzle = E.decodePuzzle(DECK, codeStr);
      S.setup.joinError = null;
      S.setup.joinCode = '';
      startPuzzle(puzzle);
    } catch (err) {
      S.setup.joinError = err.message;
      render();
    }
  }

  function doTest(slot) {
    if (S.finished) return;
    var round = activeRound();
    if (!round) {
      S.rounds.push({ code: S.proposal.slice(), tests: [] });
      S.pendingRound = false;
      round = currentRound();
    }
    if (round.tests.length >= 3) return toast('Three tests is the limit this round');
    if (round.tests.some(function (t) { return t.slot === slot; })) return;

    var card = DECK.get(S.puzzle.cardIds[slot]);
    var v = card.verifiers[S.puzzle.variants[slot]];
    var answer = !!v.fn(round.code[0], round.code[1], round.code[2]);
    round.tests.push({ slot: slot, answer: answer });
    S.justTested = slot;
    S.replayStep = null;
    save();
    render();
  }

  function doNextRound() {
    if (!roundLocked()) return;
    S.pendingRound = true;   // dials go live again; the round is spent on first test
    S.focusChannel = 0;      // typed digits start at blue again
    save();
    render();
  }

  function doColdAnswer() {
    var attempt = S.proposal.slice();
    var win = attempt.join() === S.puzzle.solution.join();
    if (!win && S.attempts.some(function (a) { return a.code.join() === attempt.join(); })) {
      return toast('You already tried that one');
    }
    S.attempts.push({ code: attempt, win: win });
    if (win) {
      S.coldMiss = null;
      S.finished = { win: true, rounds: S.attempts.length, attempt: attempt, cold: true };
      S.modal = 'reveal';
    } else {
      /* A wrong guess costs a guess and nothing else. Finishing the puzzle here
         would freeze the dials and — because the board reveals every setting
         once it is finished — hand over the answer for a single miss. */
      S.coldMiss = attempt.join(' ') + ' is not it. Some verifier would have to be idle, or two ' +
        'codes would fit. Keep going — nothing is lost.';
    }
    save();
    render();
  }

  function doAnnounce() {
    var attempt = S.proposal.slice();
    var tests = S.puzzle.cardIds.map(function (id, i) {
      var v = DECK.get(id).verifiers[S.puzzle.variants[i]];
      return { slot: i, answer: !!v.fn(attempt[0], attempt[1], attempt[2]) };
    });
    var win = tests.every(function (t) { return t.answer; });
    S.rounds.push({ code: attempt, tests: tests, final: true });
    S.replayStep = null;     // the announcement is news — show it, not wherever we were parked
    S.finished = { win: win, rounds: S.rounds.length, attempt: attempt };
    S.modal = 'reveal';
    save();
    render();
  }

  /* ------------------------------------------------------------ delegation */

  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest && ev.target.closest('[data-action]');
    if (!el) return;
    var a = el.dataset.action;

    if (a === 'overlay') {
      if (ev.target === el && S.modal !== 'reveal') { S.modal = null; S.ask = null; render(); }
      return;
    }

    switch (a) {
      case 'mode':
        S.setup.mode = el.dataset.mode; S.setup.message = null; render(); break;
      case 'count':
        S.setup.count = +el.dataset.n; render(); break;
      case 'cold-level':
        S.setup.coldLevel = el.dataset.v; render(); break;
      case 'pick-card': {
        var id = +el.dataset.id;
        var i = S.setup.chosen.indexOf(id);
        if (i === -1) {
          if (S.setup.chosen.length >= 6) return toast('Six verifiers is the maximum');
          S.setup.chosen.push(id);
        } else S.setup.chosen.splice(i, 1);
        S.setup.message = null;
        render();
        break;
      }
      case 'read-paste': {
        try {
          var got = E.parseOfficialPaste(S.setup.paste);
          while (S.setup.official.length > got.length) S.setup.official.pop();
          while (S.setup.official.length < got.length) S.setup.official.push(['', '']);
          got.forEach(function (g, i) {
            S.setup.official[i] = [String(g.cardId), String(g.verification)];
          });
          S.setup.paste = '';
          S.setup.message = { bad: false, text: 'Read in ' + got.length + ' verifiers — ' +
            'check them against the site, then start the machine.' };
        } catch (err) {
          S.setup.message = { bad: true, text: err.message };
        }
        render();
        break;
      }
      case 'official-row': {
        var d = +el.dataset.d;
        if (d > 0 && S.setup.official.length < 6) S.setup.official.push(['', '']);
        if (d < 0 && S.setup.official.length > 4) S.setup.official.splice(+el.dataset.i, 1);
        S.setup.message = null; render();
        break;
      }
      case 'clear-official':
        S.setup.official = [['', ''], ['', ''], ['', ''], ['', ''], ['', '']];
        S.setup.paste = '';
        S.setup.message = null; render();
        break;
      case 'clear-cards':
        S.setup.chosen = []; S.setup.designVariants = {}; S.setup.message = null; render(); break;
      case 'generate': doGenerate(); break;
      case 'join': doJoin((document.getElementById('join-code') || {}).value); break;

      case 'dial': {
        if (roundLocked() || S.finished) return;
        S.proposal[+el.dataset.ch] = +el.dataset.n;
        S.focusChannel = (+el.dataset.ch + 1) % 3;  // keep typing in step with clicking
        save(); render();
        break;
      }
      case 'test': doTest(+el.dataset.slot); break;
      case 'next-round': doNextRound(); break;
      case 'notes':
        S.openNotes[el.dataset.slot] = !notesOpen(el.dataset.slot); save(); render(); break;
      case 'strike': {
        if (S.finished) return;
        var slot = el.dataset.slot, vi = el.dataset.vi;
        S.notes[slot] = S.notes[slot] || {};
        if (S.notes[slot][vi]) delete S.notes[slot][vi]; else S.notes[slot][vi] = true;
        save(); render();
        break;
      }
      case 'assist': S.assist = el.dataset.v; S.replayStep = null; save(); render(); break;
      case 'grid-toggle': S.gridOpen = !S.gridOpen; save(); render(); break;
      case 'grid-mark': {
        var gi = el.dataset.i;
        if (S.grid[gi]) delete S.grid[gi]; else S.grid[gi] = 1;
        save(); render();
        break;
      }
      case 'grid-clear':
        ask({
          title: 'Rub out every mark?',
          body: 'All 125 codes come back. The options you crossed off the cards are not affected.',
          ok: 'Rub out',
          run: function () { S.grid = {}; save(); render(); }
        });
        break;
      case 'replay': S.replayStep = +el.dataset.i; render(); break;
      case 'theme':
        S.theme = S.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', S.theme);
        try { localStorage.setItem('turing:theme', S.theme); } catch (e) {}
        render();
        break;
      case 'announce':
        if (isCold()) { doColdAnswer(); break; }
        S.modal = 'announce'; render(); break;
      case 'confirm-announce': S.modal = null; doAnnounce(); break;
      case 'give-up':
        if (S.finished) return;
        ask({
          title: 'Show the answer?',
          body: 'This ends the puzzle — you will see the code and how every card was set.',
          ok: 'Show me',
          run: function () {
            /* Not an attempt — you never guessed it, so it does not belong in
               the list of codes you tried, nor in the guess count. */
            S.coldMiss = null;
            S.finished = { win: false, rounds: S.attempts.length,
              attempt: S.puzzle.solution.slice(), cold: true, gaveUp: true };
            S.modal = 'reveal'; save(); render();
          }
        });
        break;
      case 'ask-yes': {
        var run = S.ask && S.ask.run;
        S.ask = null; S.modal = null;
        if (run) run(); else render();
        break;
      }
      case 'reveal': S.modal = 'reveal'; render(); break;
      case 'rules': S.modal = 'rules'; render(); break;
      case 'index': S.modal = 'index'; render(); break;
      case 'share': S.modal = 'share'; render(); break;
      case 'close': S.modal = null; S.ask = null; render(); break;
      case 'copy': {
        var text = el.dataset.what === 'url' ? shareUrl() : S.shareCode;
        copy(text);
        break;
      }
      case 'new-game':
      case 'quit': {
        var leave = function () {
          S.ask = null;
          S.modal = null; S.screen = 'setup'; S.puzzle = null; S.shareCode = null;
          S.setup.message = null; S.setup.joinError = null;
          forgetLast();
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
          render();
        };
        var busy = !S.finished && (S.rounds.length || S.attempts.length);
        if (a === 'quit' && busy) {
          ask({
            title: 'Leave this machine?',
            body: 'Your notes are saved — the same puzzle code brings you right back to them.',
            ok: 'Leave',
            run: leave
          });
          return;
        }
        leave();
        break;
      }
    }
  });

  document.addEventListener('input', function (ev) {
    var pasteEl = ev.target && ev.target.closest && ev.target.closest('[data-action="paste-in"]');
    if (pasteEl) { S.setup.paste = pasteEl.value; return; }
    var el = ev.target && ev.target.closest && ev.target.closest('[data-action="official-in"]');
    if (!el) return;
    S.setup.official[+el.dataset.i][+el.dataset.k] = el.value.replace(/[^0-9]/g, '');
    S.setup.message = null;
  });

  document.addEventListener('paste', function (ev) {
    var el = ev.target && ev.target.closest && ev.target.closest('[data-action="paste-in"]');
    if (!el) return;
    setTimeout(function () {
      S.setup.paste = el.value;
      var btn = document.querySelector('[data-action="read-paste"]');
      if (btn) btn.click();
    }, 0);
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target && ev.target.closest && ev.target.closest('[data-action="design-variant"]');
    if (!el) return;
    var id = S.setup.chosen[+el.dataset.slot];
    S.setup.designVariants[id] = +el.value;
    S.setup.message = null;
    render();   // otherwise a stale "impossible settings" warning stays on screen
  });

  /* The whole screen is re-rendered on every action, so anything typed into an
     input has to live in state or it vanishes on the next click. */
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'join-code') S.setup.joinCode = ev.target.value;
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.target && ev.target.matches && ev.target.matches('input, select, textarea')) {
      if (ev.key === 'Enter' && ev.target.id === 'join-code') doJoin(ev.target.value);
      return;
    }
    if (ev.key === 'Escape' && S.modal) { S.modal = null; S.ask = null; render(); return; }
    if (S.screen !== 'game' || S.modal || S.finished || roundLocked()) return;
    if (/^[1-5]$/.test(ev.key)) {
      S.proposal[S.focusChannel] = +ev.key;
      S.focusChannel = (S.focusChannel + 1) % 3;
      save(); render();
    }
  });

  function copy(text) {
    var done = function () { toast('Copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select it by hand'); }
      document.body.removeChild(ta);
    }
  }

  /* ---------------------------------------------------------------- boot */

  function boot() {
    var m = /[#&]p=([A-Za-z0-9-]+)/.exec(location.hash);
    if (m) {
      try { startPuzzle(E.decodePuzzle(DECK, m[1])); return; }
      catch (e) { S.setup.joinError = e.message; }
    }
    // No puzzle in the URL — pick up whatever machine was last open, so a
    // refresh returns to the game rather than to the setup screen.
    var last = null;
    try { last = localStorage.getItem(LAST_KEY); } catch (e) {}
    if (last) {
      try { startPuzzle(E.decodePuzzle(DECK, last)); return; }
      catch (e) { forgetLast(); }
    }
    render();
  }

  function forgetLast() {
    try { localStorage.removeItem(LAST_KEY); } catch (e) {}
  }

  window.addEventListener('hashchange', function () {
    var m = /[#&]p=([A-Za-z0-9-]+)/.exec(location.hash);
    if (m) {
      try {
        var pz = E.decodePuzzle(DECK, m[1]);
        if (E.encodePuzzle(pz) !== S.shareCode) startPuzzle(pz);
      } catch (e) { /* ignore bad hash */ }
    }
  });

  boot();
})();

</script>

</body>
</html>
