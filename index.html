<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A shareable board for the Turing Machine deduction game: build a puzzle from your own criteria cards and send the code to your friends.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2ee">
<title>Turing Machine — play together</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314ae5c'/%3E%3Cpath d='M16 7 25 25H7Z' fill='%23ffffff'/%3E%3C/svg%3E">
</head>
<body>

<script>
/* Stamp the theme before first paint so no colour depends on an un-stamped
   default and nothing flashes. Light unless the player chose otherwise. */
(function () {
  var t = 'light';
  try { t = localStorage.getItem('turing:theme') || 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>

<div id="root" class="app"></div>
<noscript>
  <div class="app" style="padding-top:40px">
    <h1 style="text-transform:uppercase">Turing Machine</h1>
    <p style="color:var(--ink-dim);max-width:52ch">
      This board runs entirely in your browser, so it needs JavaScript switched on.
    </p>
  </div>
</noscript>

<style>
/* ==========================================================================
   TURING MACHINE
   Light by default, after the game's own look: white card stock, its green,
   and the blue of the verification numbers. Dark is the same design inverted.
   The theme is always stamped on <html data-theme>, so no colour depends on
   an un-stamped default.
   ========================================================================== */

:root,
:root[data-theme="light"] {
  --paper:      #ffffff;
  --ground:     #eef2ee;   /* neutral pulled slightly toward the brand green */
  --sunk:       #f6f8f6;
  --raised:     #ffffff;

  --line:       #dde5df;
  --line-firm:  #c4d0c7;

  --ink:        #0f1613;
  --ink-dim:    #5d6b63;
  --ink-faint:  #647169;

  --brand:      #14ae5c;   /* the box's green — rules, lamps, borders, marks */
  --brand-fill: #0c8547;   /* the same green, deep enough to carry white text */
  --brand-deep: #0c7f42;   /* text and borders on white */
  --brand-wash: #e6f6ed;
  --brand-on:   #ffffff;

  --verify:     #2266c4;   /* the blue the site prints verification numbers in */
  --verify-wash:#e8f0fb;

  --pass:       #14ae5c;
  --pass-wash:  #e6f6ed;
  --fail:       #c92e20;
  --fail-wash:  #fdeceb;

  --blue:       #2a68d8;  --blue-fill:   #2a68d8;  --blue-on:   #ffffff;
  --yellow:     #8d6600;  --yellow-fill: #f2c218;  --yellow-on: #2a1f00;
  --purple:     #7a44cf;  --purple-fill: #8450dd;  --purple-on: #ffffff;

  --scrim:      rgba(15, 22, 19, .45);
  --gl-shade:   #000;   /* icon outlines darken on a light ground */
  --shadow-sm:  0 1px 2px rgba(15, 32, 22, .07);
  --shadow-md:  0 2px 4px rgba(15, 32, 22, .06), 0 12px 24px -16px rgba(15, 32, 22, .3);
  --shadow-lg:  0 30px 70px -28px rgba(15, 32, 22, .45);
  --key-shadow: 0 2px 0 var(--line-firm);

  color-scheme: light;
}

:root[data-theme="dark"] {
  --paper:      #151b18;
  --ground:     #0d1210;
  --sunk:       #0a0f0d;
  --raised:     #1b2320;

  --line:       #26302b;
  --line-firm:  #36433c;

  --ink:        #e8efea;
  --ink-dim:    #9aa9a1;
  --ink-faint:  #83938a;

  --brand:      #2fd47f;
  --brand-fill: #2fd47f;
  --brand-deep: #52e39c;
  --brand-wash: #12291d;
  --brand-on:   #04170d;

  --verify:     #6aa8f5;
  --verify-wash:#131f30;

  --pass:       #2fd47f;
  --pass-wash:  #12291d;
  --fail:       #f2695a;
  --fail-wash:  #2c1614;

  --blue:       #6ea4ff;  --blue-fill:   #4785f5;  --blue-on:   #04122c;
  --yellow:     #f0c94a;  --yellow-fill: #edc033;  --yellow-on: #2a1f00;
  --purple:     #b98bf5;  --purple-fill: #9a63ec;  --purple-on: #12042c;

  --scrim:      rgba(0, 0, 0, .62);
  --gl-shade:   #fff;   /* …and lighten on a dark one */
  --shadow-sm:  0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md:  0 2px 4px rgba(0, 0, 0, .35), 0 14px 28px -18px rgba(0, 0, 0, .9);
  --shadow-lg:  0 34px 80px -30px rgba(0, 0, 0, .95);
  --key-shadow: 0 2px 0 rgba(0, 0, 0, .5);

  color-scheme: dark;
}

:root {
  --font-ui: "Avenir Next", Avenir, Futura, "Century Gothic", "Trebuchet MS",
             "Segoe UI", Tahoma, sans-serif;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
              "Cascadia Mono", "Roboto Mono", "DejaVu Sans Mono", Consolas, monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
}

/* ---------- base ---------- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--ground);
  background-image:
    radial-gradient(circle, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1.4px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: 2px; border-radius: 3px; }

h1, h2, h3, h4 { margin: 0; font-weight: 700; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.app { max-width: 1240px; margin: 0 auto; padding: 0 20px 96px; }

/* ---------- masthead ---------- */

.masthead {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
  padding: 26px 0 18px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--line);
}
.wordmark { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.wordmark h1 {
  font-size: clamp(19px, 3vw, 26px);
  letter-spacing: -.01em;
  text-transform: uppercase;
  color: var(--ink);
}
.wordmark .rule { width: 30px; height: 4px; border-radius: var(--r-pill); background: var(--brand); }
.wordmark .tag {
  font-size: 10px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
}
.masthead-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.theme-toggle {
  display: grid; place-items: center;
  width: 34px; height: 34px; flex: none;
  font-size: 15px; line-height: 1;
  color: var(--ink-dim);
  background: var(--raised);
  border: 1.5px solid var(--line-firm);
  border-radius: var(--r-pill);
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.theme-toggle:hover { color: var(--brand-deep); border-color: var(--brand); background: var(--brand-wash); }

/* ---------- buttons ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink);
  background: var(--raised);
  border: 1.5px solid var(--line-firm);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-sm);
  transition: transform .12s ease, box-shadow .15s ease, background .15s ease,
              color .15s ease, border-color .15s ease;
}
.btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand-deep); background: var(--brand-wash); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .55; }

.btn-primary { color: var(--brand-on); background: var(--brand-fill); border-color: var(--brand-fill); }
.btn-primary:hover:not(:disabled) {
  background: var(--brand-deep); border-color: var(--brand-deep); color: var(--brand-on);
}
.btn-ghost { background: transparent; box-shadow: none; border-color: var(--line-firm); color: var(--ink-dim); }
.btn-ghost:hover:not(:disabled) { background: var(--brand-wash); }
.btn-sm { padding: 7px 14px; font-size: 10.5px; }

/* ---------- panels ---------- */

.panel {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 20px;
  background: var(--sunk);
  border-bottom: 1.5px solid var(--line);
}
.panel-title {
  display: flex; align-items: center; gap: 9px;
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--brand-deep);
}
.panel-title::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--brand); }
.panel-body { padding: 20px; }

.hint { font-size: 14px; color: var(--ink-dim); line-height: 1.6; }
.hint em { color: var(--brand-deep); font-style: normal; font-weight: 700; }
.hint b { color: var(--ink); }

.tape { height: 2px; background: repeating-linear-gradient(90deg, var(--line-firm) 0 6px, transparent 6px 12px); }

/* ==========================================================================
   SETUP
   ========================================================================== */

.setup { display: grid; gap: 20px; }

.hero {
  padding: 38px 34px;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-left: 6px solid var(--brand);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
}
.hero h2 {
  font-size: clamp(23px, 3.6vw, 34px);
  line-height: 1.15; letter-spacing: -.02em;
  color: var(--ink);
  max-width: 21ch;
  text-wrap: balance;
}
.hero p { margin: 14px 0 0; max-width: 62ch; font-size: 16px; color: var(--ink-dim); }

.setup-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}
.input, select.input, textarea.input {
  width: 100%;
  padding: 11px 13px;
  background: var(--sunk);
  border: 1.5px solid var(--line-firm);
  border-radius: var(--r-sm);
  color: var(--ink);
}
.input::placeholder { color: var(--ink-faint); }
.input:focus {
  outline: none; background: var(--paper);
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-wash);
}
.input.code-input {
  font-family: var(--font-num);
  font-size: 17px; letter-spacing: .16em; text-align: center; text-transform: uppercase;
}

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  padding: 8px 15px;
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-dim);
  background: var(--sunk);
  border: 1.5px solid var(--line-firm);
  border-radius: var(--r-pill);
  transition: all .15s ease;
}
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); border-color: var(--brand); }
.seg button[aria-pressed="true"] { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--brand-on); }

.card-picker {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 6px; margin-top: 4px;
}
.card-chip {
  aspect-ratio: 1; display: grid; place-items: center;
  font-family: var(--font-num); font-size: 13px;
  color: var(--ink-dim);
  background: var(--sunk);
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  transition: all .13s ease;
}
.card-chip:hover { border-color: var(--brand); color: var(--brand-deep); }
.card-chip[aria-pressed="true"] {
  background: var(--brand-fill); border-color: var(--brand-fill); color: var(--brand-on); font-weight: 700;
}

.status-line {
  margin-top: 14px; padding: 11px 14px;
  font-size: 13.5px;
  color: var(--brand-deep);
  background: var(--brand-wash);
  border: 1.5px solid color-mix(in srgb, var(--brand) 35%, transparent);
  border-radius: var(--r-sm);
}
.status-line.bad {
  color: var(--fail); background: var(--fail-wash);
  border-color: color-mix(in srgb, var(--fail) 35%, transparent);
}

/* ---------- official puzzle importer ---------- */

.paste-box { margin-bottom: 16px; }
.paste-box textarea.input {
  min-height: 96px; resize: vertical;
  font-family: var(--font-num); font-size: 13px; line-height: 1.5;
}
.paste-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

.official-grid { display: grid; gap: 7px; margin-top: 4px; }
.official-head, .official-row {
  display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 9px; align-items: center;
}
.official-head span {
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint);
}
.official-letter {
  display: grid; place-items: center;
  width: 26px; height: 26px;
  font-size: 11.5px; font-weight: 700;
  color: var(--brand-on); background: var(--brand-fill);
  border-radius: var(--r-sm);
}
.official-row .input {
  padding: 9px 10px; text-align: center;
  font-family: var(--font-num); letter-spacing: .06em;
}
/* the verification column, in the blue the site uses for it */
.official-row .input[data-k="1"] {
  color: var(--verify);
  background: var(--verify-wash);
  border-color: color-mix(in srgb, var(--verify) 40%, transparent);
}
.official-row .input[data-k="1"]:focus {
  border-color: var(--verify);
  box-shadow: 0 0 0 3px var(--verify-wash);
}
.official-drop {
  width: 26px; height: 26px; display: grid; place-items: center;
  font-size: 16px; line-height: 1; color: var(--ink-faint);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  transition: all .15s ease;
}
.official-drop:hover { color: var(--fail); border-color: var(--fail); background: var(--fail-wash); }

/* ==========================================================================
   GAME
   ========================================================================== */

.game { display: grid; gap: 20px; }

.strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1.5px;
  background: var(--line);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.strip-cell { padding: 12px 16px; background: var(--paper); }
.strip-cell dt {
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint);
}
.strip-cell dd {
  margin: 3px 0 0;
  font-family: var(--font-num); font-size: 20px;
  color: var(--brand-deep); font-variant-numeric: tabular-nums;
}
.strip-cell.wide dd { font-size: 13px; color: var(--ink); letter-spacing: .1em; word-break: break-all; }

/* ---------- verifier rack ---------- */

.rack { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }

.verifier {
  display: flex; flex-direction: column;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  transition: border-color .2s ease, box-shadow .2s ease;
}
.verifier.stagger { animation: rise .45s cubic-bezier(.2,.7,.3,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.verifier.is-yes { border-color: color-mix(in srgb, var(--pass) 55%, transparent); }
.verifier.is-no  { border-color: color-mix(in srgb, var(--fail) 55%, transparent); }
.verifier.is-solved { border-color: var(--line-firm); }

.verifier-top {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  background: var(--sunk);
  border-bottom: 1.5px solid var(--line);
}
.verifier-letter {
  width: 28px; height: 28px; flex: none;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
  color: var(--brand-on); background: var(--brand-fill);
  border-radius: var(--r-sm);
}
.verifier-no {
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint);
}
.verifier-no b {
  display: block; font-family: var(--font-num); font-size: 15px;
  letter-spacing: 0; color: var(--ink);
}

.lamp {
  margin-left: auto; width: 12px; height: 12px; border-radius: 50%;
  background: var(--sunk); border: 1.5px solid var(--line-firm);
  transition: all .25s ease;
}
.lamp.yes { background: var(--brand-fill); border-color: var(--brand-fill); }
.lamp.no  { background: var(--fail); border-color: var(--fail); }

.verifier-question { padding: 13px; font-size: 14.5px; line-height: 1.45; color: var(--ink); flex: 1; }

.verifier-foot { padding: 0 13px 13px; display: grid; gap: 8px; }
.test-btn { width: 100%; }

.test-result {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px; border-radius: var(--r-pill);
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  border: 1.5px solid transparent;
}
.test-result.fresh { animation: stamp .34s cubic-bezier(.2,1.4,.4,1); }
@keyframes stamp { from { transform: scale(1.14); opacity: 0; } }
.test-result.yes {
  background: var(--pass-wash); color: var(--brand-deep);
  border-color: color-mix(in srgb, var(--pass) 40%, transparent);
}
.test-result.no {
  background: var(--fail-wash); color: var(--fail);
  border-color: color-mix(in srgb, var(--fail) 40%, transparent);
}
/* the placeholder a finished board shows where the Test button used to be */
.test-result.revealed {
  background: var(--sunk); color: var(--ink-dim);
  border-color: var(--line-firm);
}

.notes-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 7px 10px;
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  transition: all .15s ease;
}
.notes-toggle:hover { color: var(--brand-deep); border-color: var(--brand); }
.notes-toggle .count { font-family: var(--font-num); color: var(--ink-dim); }

.variants { display: grid; gap: 4px; padding: 2px 0; }
.variant {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 9px; text-align: left;
  font-size: 13.5px; line-height: 1.35;
  color: var(--ink-dim);
  background: var(--sunk);
  border: 1.5px solid transparent; border-radius: var(--r-sm);
  transition: all .13s ease;
}
.variant:hover { color: var(--ink); border-color: var(--line-firm); }
.variant .mark {
  flex: none; width: 15px; height: 15px; margin-top: 2px;
  display: grid; place-items: center;
  font-family: var(--font-num); font-size: 10px;
  border: 1.5px solid var(--line-firm); border-radius: 3px;
  color: transparent;
}
.variant.struck { color: var(--ink-faint); text-decoration: line-through; }
.variant.struck .mark { color: var(--fail); border-color: var(--fail); }
.variant.auto-struck { color: var(--ink-faint); text-decoration: line-through; opacity: .9; }
.variant.auto-struck .mark { color: var(--ink-faint); }
.variant.revealed {
  color: var(--brand-deep); background: var(--brand-wash);
  border-color: var(--brand); text-decoration: none; font-weight: 700;
}
.variant.revealed .mark { color: var(--brand-deep); border-color: var(--brand); }

/* ---------- console ---------- */

.lower { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }

.dials { display: grid; gap: 13px; }
.dial-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; }
.dial-label { display: flex; align-items: center; gap: 8px; }
.dial-label .glyph { width: 17px; height: 17px; flex: none; }
.dial-label span {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-dim);
}
.dial-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 320px; }
.key {
  aspect-ratio: 1; display: grid; place-items: center;
  font-family: var(--font-num); font-size: 17px;
  color: var(--ink-dim);
  background: var(--paper);
  border: 1.5px solid var(--line-firm); border-radius: var(--r-sm);
  box-shadow: var(--key-shadow);
  transition: all .12s ease;
}
.key:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.key:disabled { opacity: .75; }
.key[aria-pressed="true"] {
  font-weight: 700;
  background: var(--dial-fill); border-color: var(--dial-fill); color: var(--dial-on);
  box-shadow: none; opacity: 1;
}
.dial-row.blue   { --dial-fill: var(--blue-fill);   --dial-on: var(--blue-on); }
.dial-row.yellow { --dial-fill: var(--yellow-fill); --dial-on: var(--yellow-on); }
.dial-row.purple { --dial-fill: var(--purple-fill); --dial-on: var(--purple-on); }

.proposal-readout {

}
.readout-digit { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.readout-digit.yellow { color: var(--yellow); }
.readout-digit.purple { color: var(--purple); }

.console-actions { display: grid; gap: 10px; padding-top: 6px; }
.console-actions .row { display: flex; gap: 8px; }
.console-actions .row .btn { flex: 1; }

.tests-left {
  display: flex; align-items: center; gap: 7px;
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint);
}
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-firm); }
.pip.used { background: var(--brand-fill); border-color: var(--brand-fill); }

/* ---------- logbook ---------- */

.log-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.log-table th {
  padding: 9px 6px; text-align: center;
  font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint);
  border-bottom: 1.5px solid var(--line);
}
.log-table th:first-child, .log-table td:first-child { text-align: left; padding-left: 16px; }
.log-table td {
  padding: 8px 6px; text-align: center;
  font-family: var(--font-num); font-size: 14px;
  border-bottom: 1px solid var(--line);
}
.log-table tbody tr:hover { background: var(--sunk); }
.log-table tr.current { background: var(--brand-wash); }
.log-round { color: var(--ink-faint); font-size: 12px; }
.log-code .b { color: var(--blue); font-weight: 700; }
.log-code .y { color: var(--yellow); font-weight: 700; }
.log-code .p { color: var(--purple); font-weight: 700; }
.log-yes { color: var(--brand-deep); font-weight: 700; }
.log-no  { color: var(--fail); font-weight: 700; }
.log-empty { color: var(--ink-faint); }

.empty-note { padding: 28px 18px; text-align: center; font-size: 14px; color: var(--ink-faint); }

.assist-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-top: 1.5px solid var(--line);
}
.assist-bar .label {
  font-size: 10px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}

.candidates { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 20px 0; }
.candidate {
  padding: 5px 10px;
  font-family: var(--font-num); font-size: 13px;
  background: var(--sunk);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
}

/* ==========================================================================
   OVERLAYS
   ========================================================================== */

.overlay {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center; padding: 20px;
  background: var(--scrim);
  backdrop-filter: blur(3px);
}
.overlay.fresh { animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }

.modal {
  width: min(620px, 100%); max-height: 86vh; overflow-y: auto;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
}
.overlay.fresh .modal { animation: pop .28s cubic-bezier(.2,.9,.3,1); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.99); } }

.modal .panel-body h3 {
  font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--brand-deep); margin: 22px 0 8px;
}
.modal .panel-body h3:first-child { margin-top: 0; }
.modal .panel-body p, .modal .panel-body li { font-size: 15px; color: var(--ink-dim); line-height: 1.6; }
.modal .panel-body b { color: var(--ink); }
.modal .panel-body ul { margin: 6px 0; padding-left: 20px; }
.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 14px 20px; background: var(--sunk); border-top: 1.5px solid var(--line);
}

.verdict { text-align: center; padding: 34px 24px 24px; }
.verdict .seal {
  width: 78px; height: 78px; margin: 0 auto 18px;
  display: grid; place-items: center;
  font-size: 34px; border-radius: 50%;
  color: var(--brand-on);
}
.verdict.win .seal { background: var(--brand-fill); }
.verdict.lose .seal { background: var(--fail); color: #fff; }
.verdict h2 { font-size: 28px; letter-spacing: -.02em; color: var(--ink); margin-bottom: 8px; }
.verdict .sub { font-size: 15px; color: var(--ink-dim); }

.reveal-code { display: flex; justify-content: center; gap: 16px; margin: 22px 0 6px; }
.reveal-code .num { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; }

.reveal-list { display: grid; gap: 8px; padding: 4px 20px 20px; }
.reveal-row {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start;
  padding: 11px 13px;
  background: var(--sunk);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
}
.reveal-row .letter {
  width: 26px; height: 26px; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 700;
  color: var(--brand-on); background: var(--brand-fill); border-radius: var(--r-sm);
}
.reveal-row .txt { font-size: 14.5px; color: var(--ink); }
.reveal-row .card-ref {
  display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint); margin-top: 3px;
}

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90;
  padding: 11px 20px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--paper); background: var(--ink);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-lg);
  animation: toast-in .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 12px); } }

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */

@media (max-width: 900px) {
  .lower { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .app { padding: 0 14px 80px; }
  .hero { padding: 26px 20px; }
  .dial-row { grid-template-columns: 1fr; gap: 6px; }
  .readout-digit .num { font-size: 28px; }
  .official-head, .official-row { grid-template-columns: 26px 1fr 1fr 40px; }
  .official-drop { width: 40px; height: 40px; font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

   The printed cards say it in shapes and signs; these do the same.
   ========================================================================== */

.glyphs {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--gl-gap);
  --gl-size: 22px;
  --gl-gap: 7px;
  --gl-text: 15px;
}
.glyphs.gl-sm { --gl-size: 15px; --gl-gap: 5px; --gl-text: 11.5px; }

.gl-svg { width: var(--gl-size); height: var(--gl-size); display: block; }
/* Bright fill so the shape still reads as its own colour, with a darker edge
   of the same hue so it stays defined on white. Taking the ink token alone
   made the yellow square a dark olive — legible, but no longer yellow, which
   is the one thing this glyph exists to say. */
.gl-shape svg {
  fill: currentColor;
  stroke: var(--gl-edge);
  stroke-width: 2;
  stroke-linejoin: round;
}
/* The outline is measured in device pixels, not viewBox units. A stroke that
   scales with the icon shrinks to a fraction of a pixel at the 15px size used
   in the options list, and antialiasing then blends it away to roughly half
   the contrast it computes to on paper. */
.gl-shape svg * { vector-effect: non-scaling-stroke; }

.gl-shape.gl-blue   { color: var(--blue-fill);   --gl-edge: color-mix(in srgb, var(--blue-fill)   58%, var(--gl-shade)); }
.gl-shape.gl-yellow { color: var(--yellow-fill); --gl-edge: color-mix(in srgb, var(--yellow-fill) 58%, var(--gl-shade)); }
.gl-shape.gl-purple { color: var(--purple-fill); --gl-edge: color-mix(in srgb, var(--purple-fill) 58%, var(--gl-shade)); }

.gl-num {
  display: grid; place-items: center;
  min-width: var(--gl-size); height: var(--gl-size);
  padding: 0 3px;
  font-family: var(--font-num); font-size: var(--gl-text); font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--line-firm); border-radius: 4px;
}
.gl-op {
  font-family: var(--font-num); font-size: var(--gl-text); font-weight: 700;
  color: var(--ink-dim);
}
.gl-sum {
  font-size: calc(var(--gl-text) + 3px); font-weight: 700;
  line-height: 1; color: var(--ink);
}
.gl-word {
  padding: 2px 7px;
  font-size: calc(var(--gl-text) - 3px); font-weight: 700; letter-spacing: .07em;
  color: var(--ink-dim);
  background: var(--sunk);
  border: 1.5px solid var(--line); border-radius: var(--r-pill);
  white-space: nowrap;
}

.gl-fig { color: var(--ink-dim); display: block; }

<script>
/* ==========================================================================
   TURING MACHINE — deduction engine
   Pure logic. No DOM. Safe to run in node for tests.
   A "code" is [b, y, p] with each value in 1..5  →  125 possible codes.
   Codes are indexed 0..124 as (b-1)*25 + (y-1)*5 + (p-1).
   Sets of codes are 128-bit masks stored as Uint32Array(4).
   ========================================================================== */

const N_CODES = 125;

/* ---------- code helpers ---------- */

function codeIndex(b, y, p) { return (b - 1) * 25 + (y - 1) * 5 + (p - 1); }

function codeFromIndex(i) {
  return [Math.floor(i / 25) + 1, Math.floor(i / 5) % 5 + 1, (i % 5) + 1];
}

const ALL_CODES = Array.from({ length: N_CODES }, (_, i) => codeFromIndex(i));

/* ---------- 128-bit masks ---------- */

function maskNew() { return new Uint32Array(4); }
function maskSet(m, i) { m[i >>> 5] |= (1 << (i & 31)); }
function maskGet(m, i) { return (m[i >>> 5] >>> (i & 31)) & 1; }
function maskFull() {
  const m = maskNew();
  for (let i = 0; i < N_CODES; i++) maskSet(m, i);
  return m;
}
function maskAnd(a, b, out) {
  const o = out || maskNew();
  o[0] = a[0] & b[0]; o[1] = a[1] & b[1]; o[2] = a[2] & b[2]; o[3] = a[3] & b[3];
  return o;
}
function maskOr(a, b, out) {
  const o = out || maskNew();
  o[0] = a[0] | b[0]; o[1] = a[1] | b[1]; o[2] = a[2] | b[2]; o[3] = a[3] | b[3];
  return o;
}
function popcount32(v) {
  v = v - ((v >>> 1) & 0x55555555);
  v = (v & 0x33333333) + ((v >>> 2) & 0x33333333);
  v = (v + (v >>> 4)) & 0x0f0f0f0f;
  return (v * 0x01010101) >>> 24;
}
function maskCount(m) {
  return popcount32(m[0]) + popcount32(m[1]) + popcount32(m[2]) + popcount32(m[3]);
}
function maskFirst(m) {
  for (let w = 0; w < 4; w++) {
    if (m[w] === 0) continue;
    for (let bit = 0; bit < 32; bit++) {
      if ((m[w] >>> bit) & 1) return w * 32 + bit;
    }
  }
  return -1;
}
function maskToIndices(m) {
  const out = [];
  for (let i = 0; i < N_CODES; i++) if (maskGet(m, i)) out.push(i);
  return out;
}

/* ---------- criteria compilation ---------- */

/**
 * Takes the raw criteria.json array and attaches, for every verifier variant,
 * the precomputed mask of codes that satisfy it.
 */
function compileCriteria(raw) {
  const cards = raw.map((card) => {
    const verifiers = card.verifiers.map((v, vi) => {
      let fn;
      try {
        // eslint-disable-next-line no-new-func
        fn = new Function('b', 'y', 'p', 'return !!(' + v.expr + ');');
      } catch (e) {
        throw new Error(`Card ${card.id} variant ${vi}: cannot compile expr "${v.expr}" — ${e.message}`);
      }
      const mask = maskNew();
      for (let i = 0; i < N_CODES; i++) {
        const [b, y, p] = ALL_CODES[i];
        if (fn(b, y, p)) maskSet(mask, i);
      }
      return { index: vi, text: v.text, expr: v.expr, fn, mask };
    });
    return { id: card.id, title: card.title, description: card.description, verifiers };
  });

  const byId = new Map(cards.map((c) => [c.id, c]));
  return { cards, byId, get: (id) => byId.get(id) };
}

/**
 * Sanity checks for the criteria deck.
 *
 * Note on exclusivity: a criteria card is a *menu* of possible settings, not a
 * partition of the code space. Only cards 1–25 have mutually exclusive
 * variants; from 26 up a card offers things like "blue is even / blue is odd /
 * yellow is even / …", where several options can be true of one code at once.
 * So we only assert exclusivity where the game actually has it.
 */
const MUTUALLY_EXCLUSIVE_UP_TO = 25;

function validateDeck(deck) {
  const problems = [];
  for (const card of deck.cards) {
    if (!card.verifiers.length) problems.push({ cardId: card.id, kind: 'no-variants' });

    for (const v of card.verifiers) {
      const n = maskCount(v.mask);
      if (n === 0) problems.push({ cardId: card.id, kind: 'never-true', text: v.text });
      if (n === N_CODES) problems.push({ cardId: card.id, kind: 'always-true', text: v.text });
    }

    if (card.id <= MUTUALLY_EXCLUSIVE_UP_TO) {
      for (let i = 0; i < N_CODES; i++) {
        let hits = 0;
        for (const v of card.verifiers) hits += maskGet(v.mask, i);
        if (hits > 1) {
          problems.push({ cardId: card.id, kind: 'not-exclusive', code: codeFromIndex(i), matches: hits });
          break;
        }
      }
    }
  }
  return problems;
}

/* ---------- puzzle validity ---------- */

/**
 * An assignment is [{ cardId, variantIndex }, ...].
 * A puzzle is legal when:
 *   1. exactly one of the 125 codes satisfies every chosen verifier, and
 *   2. no verifier is redundant — dropping any one of them makes the
 *      solution ambiguous (this is the official "no useless card" rule).
 */
function checkAssignment(deck, assignment) {
  const masks = assignment.map((a) => deck.get(a.cardId).verifiers[a.variantIndex].mask);
  let all = maskFull();
  for (const m of masks) all = maskAnd(all, m);
  const count = maskCount(all);
  if (count !== 1) {
    return { ok: false, reason: count === 0 ? 'no-solution' : 'ambiguous', count };
  }

  // Playable, but is any card doing nothing? Worth flagging, not fatal.
  let redundantIndex = -1;
  for (let skip = 0; skip < masks.length; skip++) {
    let m = maskFull();
    for (let i = 0; i < masks.length; i++) if (i !== skip) m = maskAnd(m, masks[i]);
    if (maskCount(m) === 1) { redundantIndex = skip; break; }
  }

  return {
    ok: true,
    count,
    solution: codeFromIndex(maskFirst(all)),
    solutionIndex: maskFirst(all),
    redundant: redundantIndex !== -1,
    redundantIndex: redundantIndex === -1 ? null : redundantIndex,
  };
}

/**
 * Enumerate every legal variant assignment for a fixed set of card ids.
 * Returns { assignments: [{ variants:[i,...], solutionIndex }], truncated,
 *           spread } where `spread` is how many *distinct* codes those
 * assignments point at.
 *
 * `spread` matters more than it looks. A player can see the card numbers, so
 * they can reason about which settings would be legal at all. If every legal
 * setting of the chosen cards leads to the same code (spread === 1), the
 * puzzle answers itself before a single test is made.
 *
 * opts.allowRedundant — skip the "every card must matter" rule.
 * opts.limit          — guard against pathological card sets.
 */
function enumerateAssignments(deck, cardIds, opts = {}) {
  const { allowRedundant = false, limit = 400000 } =
    typeof opts === 'number' ? { limit: opts } : opts;

  const cards = cardIds.map((id) => deck.get(id));
  if (cards.some((c) => !c)) throw new Error('unknown card id in ' + JSON.stringify(cardIds));

  const out = [];
  let truncated = false;

  const variants = new Array(cards.length).fill(0);
  const partial = Array.from({ length: cards.length + 1 }, () => maskNew());
  partial[0].set(maskFull());

  let examined = 0;
  let uniqueCount = 0;

  const recurse = (depth) => {
    if (truncated) return;
    if (depth === cards.length) {
      examined++;
      if (examined > limit) { truncated = true; return; }
      const all = partial[cards.length];
      if (maskCount(all) !== 1) return;
      uniqueCount++;   // passes rule 1; rule 2 may still reject it
      if (!allowRedundant) {
        for (let skip = 0; skip < cards.length; skip++) {
          let m = maskFull();
          for (let i = 0; i < cards.length; i++) {
            if (i !== skip) m = maskAnd(m, cards[i].verifiers[variants[i]].mask);
          }
          if (maskCount(m) === 1) return; // that card was redundant
        }
      }
      out.push({ variants: variants.slice(), solutionIndex: maskFirst(all) });
      return;
    }
    const card = cards[depth];
    for (let v = 0; v < card.verifiers.length; v++) {
      maskAnd(partial[depth], card.verifiers[v].mask, partial[depth + 1]);
      if (maskCount(partial[depth + 1]) === 0) continue; // prune dead branches
      variants[depth] = v;
      recurse(depth + 1);
      if (truncated) return;
    }
  };

  recurse(0);
  const spread = new Set(out.map((a) => a.solutionIndex)).size;
  return { assignments: out, truncated, spread, uniqueCount };
}

/* ---------- puzzle generation ---------- */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* A puzzle whose card numbers alone give the game away isn't a puzzle. We
   insist a randomly dealt set leaves at least this many codes in play. */
const MIN_SPREAD = 4;

/**
 * Build a playable puzzle.
 *   opts.cardIds   – exact cards to use (order preserved). Optional.
 *   opts.count     – how many verifiers when cards are drawn at random.
 *   opts.rnd       – random source.
 *   opts.tries     – how many random card sets to attempt.
 *   opts.minSpread – reject card sets that give away too much (random mode).
 *
 * Returns { cardIds, variants, solution, spread, relaxed } or throws with
 * .code = 'NO_LEGAL_ASSIGNMENT' | 'GENERATION_FAILED'.
 */
function generatePuzzle(deck, opts = {}) {
  const rnd = opts.rnd || Math.random;
  const allIds = deck.cards.map((c) => c.id);

  const build = (cardIds, res, relaxed) => {
    const pick = res.assignments[Math.floor(rnd() * res.assignments.length)];
    return {
      cardIds: cardIds.slice(),
      variants: pick.variants,
      solution: codeFromIndex(pick.solutionIndex),
      spread: res.spread,
      relaxed: relaxed || null,
      redundant: relaxed === 'redundant',
    };
  };

  /* --- the player named the cards: honour them, relaxing rules if we must --- */
  if (opts.cardIds && opts.cardIds.length) {
    const strict = enumerateAssignments(deck, opts.cardIds);
    if (strict.assignments.length) return build(opts.cardIds, strict, null);

    // Nothing satisfies "every card matters". Rather than refuse the player's
    // own cards, drop that one rule and say so.
    const loose = enumerateAssignments(deck, opts.cardIds, { allowRedundant: true });
    if (loose.assignments.length) return build(opts.cardIds, loose, 'redundant');

    const err = new Error('no-legal-assignment');
    err.code = 'NO_LEGAL_ASSIGNMENT';
    throw err;
  }

  /* --- random deal: keep dealing until we get a set worth playing --- */
  const count = opts.count || 5;
  const tries = opts.tries || 600;
  const minSpread = opts.minSpread == null ? MIN_SPREAD : opts.minSpread;
  let fallback = null;

  for (let t = 0; t < tries; t++) {
    const cardIds = shuffled(allIds, rnd).slice(0, count);
    let res;
    try { res = enumerateAssignments(deck, cardIds, { limit: 120000 }); }
    catch (e) { continue; }
    if (!res.assignments.length) continue;
    if (res.spread >= minSpread) return build(cardIds, res, null);
    if (!fallback || res.spread > fallback.res.spread) fallback = { cardIds, res };
  }

  if (fallback && fallback.res.spread > 1) return build(fallback.cardIds, fallback.res, 'shallow');

  const err = new Error('generation-failed');
  err.code = 'GENERATION_FAILED';
  throw err;
}

/**
 * A "no questions" puzzle: a card set whose numbers alone force the answer.
 *
 * In the ordinary game this is a defect — if every legal setting of the chosen
 * cards points at the same code, asking the machine anything is pointless, so
 * generatePuzzle rejects it. As a deliberate variant it is the whole puzzle:
 * the player reasons from the card list and the two standing rules (exactly
 * one code fits; no card is idle) with no answers to go on at all.
 *
 * opts.ways: 'single' (default) insists there is exactly one legal setting, so
 * the settings themselves are deducible. 'any' also allows sets where several
 * settings are legal but all agree on the code — a subtler puzzle, since the
 * code is knowable while the settings are not.
 */
/*
 * What makes one of these hard is not how many cards it has — it is how many
 * of them are cards 26-48. Those offer a *menu* of separate criteria rather
 * than mutually exclusive states, so several options can be true of one code
 * at once and you cannot reason "this one holds, so the others don't".
 *
 * Measured over 300 self-solving sets: with no menu cards the median set has
 * 108 possible settings and 11 that survive rule 1 (and so must be knocked out
 * by rule 2); with four menu cards it is 1,944 and 187.
 */
const COLD_TIERS = {
  gentle:   { exclusiveOnly: true,  maxSpace: 220,  maxSurvivors: 20 },
  standard: { exclusiveOnly: false, maxSpace: 1200, maxSurvivors: 90 },
  tough:    { exclusiveOnly: false, minMenus: 3 },
};

function generateColdPuzzle(deck, opts = {}) {
  const rnd = opts.rnd || Math.random;
  const count = opts.count || 5;
  const tries = opts.tries || 12000;
  const wantSingle = (opts.ways || 'single') === 'single';
  const tier = COLD_TIERS[opts.difficulty] || COLD_TIERS.standard;
  const allIds = deck.cards
    .filter((c) => !tier.exclusiveOnly || c.id <= MUTUALLY_EXCLUSIVE_UP_TO)
    .map((c) => c.id);
  let fallback = null;

  for (let t = 0; t < tries; t++) {
    const cardIds = shuffled(allIds, rnd).slice(0, count);

    const space = cardIds.reduce((a, id) => a * deck.get(id).verifiers.length, 1);
    if (tier.maxSpace && space > tier.maxSpace) continue;
    if (tier.minMenus &&
        cardIds.filter((id) => id > MUTUALLY_EXCLUSIVE_UP_TO).length < tier.minMenus) continue;

    let res;
    try { res = enumerateAssignments(deck, cardIds, { limit: 120000 }); }
    catch (e) { continue; }
    if (!res.assignments.length || res.spread !== 1) continue;
    if (tier.maxSurvivors && res.uniqueCount > tier.maxSurvivors) continue;

    const puzzle = {
      cardIds,
      variants: res.assignments[0].variants,
      solution: codeFromIndex(res.assignments[0].solutionIndex),
      spread: 1,
      cold: true,
      ways: res.assignments.length,
      survivors: res.uniqueCount,
      difficulty: opts.difficulty || 'standard',
      searchSpace: cardIds.reduce((a, id) => a * deck.get(id).verifiers.length, 1),
      relaxed: null,
      redundant: false,
    };
    if (!wantSingle || res.assignments.length === 1) return puzzle;
    if (!fallback) fallback = puzzle;
  }

  if (fallback) return fallback;
  const err = new Error('generation-failed');
  err.code = 'GENERATION_FAILED';
  throw err;
}

/**
 * Does this card set answer itself? Derived, not stored — so a shared puzzle
 * arrives in the right mode without spending a bit in the share code.
 */
function coldness(deck, puzzle) {
  const res = enumerateAssignments(deck, puzzle.cardIds,
    { allowRedundant: !!puzzle.redundant });
  return {
    cold: res.spread === 1,
    ways: res.assignments.length,
    survivors: res.uniqueCount,
    spread: res.spread,
    searchSpace: puzzle.cardIds.reduce((a, id) => a * deck.get(id).verifiers.length, 1),
  };
}

/* ---------- share codes ---------- */
/*
 * Bit layout:  [4 bits version][4 bits n][n × (6 bits cardId-1, 4 bits variant)]
 * Rendered in Crockford base32 — uppercase, case-insensitive, and free of the
 * I/L/O/U characters people mishear. A 6-verifier puzzle is 14 characters,
 * short enough to read aloud over a video call.
 */

const SHARE_VERSION = 1;
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const B32_LOOKUP = (() => {
  const m = new Map();
  for (let i = 0; i < B32.length; i++) m.set(B32[i], i);
  // forgiving aliases for the characters Crockford drops
  m.set('O', 0); m.set('I', 1); m.set('L', 1); m.set('U', B32.indexOf('V'));
  return m;
})();

function encodePuzzle(puzzle) {
  const bits = [];
  const push = (value, width) => {
    for (let i = width - 1; i >= 0; i--) bits.push((value >> i) & 1);
  };
  push(SHARE_VERSION, 4);
  push(puzzle.cardIds.length, 4);
  puzzle.cardIds.forEach((id, i) => {
    push(id - 1, 6);
    push(puzzle.variants[i], 4);
  });
  /* The payload is 8 + 10n bits, which always leaves exactly 2 bits of
     padding. Spend one of them on "this came off turingmachine.info" so the
     provenance survives being shared — a friend who pastes the code should see
     the same label the importer saw. Codes made before this flag existed have
     it zero, so they still read as ordinary puzzles. */
  bits.push(puzzle.official ? 1 : 0);
  while (bits.length % 5 !== 0) bits.push(0);

  let out = '';
  for (let i = 0; i < bits.length; i += 5) {
    let v = 0;
    for (let j = 0; j < 5; j++) v = (v << 1) | bits[i + j];
    out += B32[v];
  }
  return out.replace(/(.{5})(?=.)/g, '$1-');
}

function decodePuzzle(deck, codeStr) {
  if (!codeStr) throw new Error('Enter a puzzle code first.');
  const cleaned = String(codeStr).trim().toUpperCase()
    .replace(/^TM[:\-\s]*/, '')
    .replace(/[-\s_]/g, '');
  if (!cleaned) throw new Error('Enter a puzzle code first.');

  const bits = [];
  for (const ch of cleaned) {
    if (!B32_LOOKUP.has(ch)) throw new Error(`“${ch}” isn’t a character we use in puzzle codes.`);
    const v = B32_LOOKUP.get(ch);
    for (let i = 4; i >= 0; i--) bits.push((v >> i) & 1);
  }
  let cursor = 0;
  const take = (width) => {
    if (cursor + width > bits.length) throw new Error('That code is too short — is any of it missing?');
    let v = 0;
    for (let i = 0; i < width; i++) v = (v << 1) | bits[cursor + i];
    cursor += width;
    return v;
  };

  const version = take(4);
  if (version !== SHARE_VERSION) throw new Error('That code came from a different version of the app.');
  const n = take(4);
  if (n < 1 || n > 12) throw new Error('That code doesn’t look like a puzzle.');

  const cardIds = [];
  const variants = [];
  for (let i = 0; i < n; i++) {
    const id = take(6) + 1;
    const vi = take(4);
    const card = deck.get(id);
    if (!card) throw new Error(`That code refers to criteria card ${id}, which doesn’t exist.`);
    if (vi >= card.verifiers.length) throw new Error(`That code refers to an option card ${id} doesn’t have.`);
    cardIds.push(id); variants.push(vi);
  }
  const official = cursor < bits.length ? take(1) === 1 : false;

  const check = checkAssignment(deck, cardIds.map((cardId, i) => ({ cardId, variantIndex: variants[i] })));
  if (!check.ok) {
    throw new Error(check.reason === 'ambiguous'
      ? 'That code decodes to a puzzle with ' + check.count + ' possible answers, so it can’t be played.'
      : 'That code decodes to a puzzle no code can satisfy.');
  }
  /* `relaxed` has to survive the round trip: a shared or reloaded puzzle is the
     same puzzle, so whoever opens the code needs the same "one card here is
     redundant" warning the builder saw. */
  return {
    cardIds, variants, solution: check.solution,
    redundant: check.redundant,
    relaxed: check.redundant ? 'redundant' : null,
    official,
  };
}

/* ---------- official puzzles ---------- */
/*
 * turingmachine.info states a puzzle as criteria card number + *verification*
 * card number. The verification number is the secret half: it names which
 * option of that criteria card is active. The mapping lives on the physical
 * verification cards, but it has been transcribed (see data/OFFICIAL_IMPORT.md)
 * — 95 check cards × 4 symbol columns = 380 globally unique numbers.
 *
 * pairs: [{ cardId, verification }]. Returns the same puzzle shape as
 * generatePuzzle, so an imported puzzle plays and shares like any other.
 */
function decodeOfficial(deck, table, pairs) {
  if (!pairs || pairs.length < 4 || pairs.length > 6) {
    throw new Error('An official puzzle has between 4 and 6 verifiers.');
  }

  const seen = new Set();
  const slots = pairs.map(({ cardId, verification }, i) => {
    const letter = 'ABCDEF'[i];
    const card = deck.get(cardId);
    if (!card) throw new Error(`${letter}: there is no criteria card ${cardId}.`);
    if (seen.has(cardId)) throw new Error(`Criteria card ${cardId} is listed twice.`);
    seen.add(cardId);

    const entry = table.numbers[verification];
    if (!entry) {
      throw new Error(`${letter}: ${verification} isn’t a verification card number. ` +
        'They run from 201 to 798 — check for a typo.');
    }
    const check = table.checkCards[entry.card];
    const variantIndex = check.options[cardId];
    if (variantIndex === undefined) {
      throw new Error(`${letter}: verification card ${verification} doesn’t go with ` +
        `criteria card ${cardId}. One of the two numbers is off.`);
    }
    return { cardId, verification, variantIndex, symbol: entry.symbol };
  });

  // Every verification number in a real puzzle is drawn from the same symbol
  // column, so a mismatch means a mistyped number that happened to be valid.
  const symbols = [...new Set(slots.map((s) => s.symbol))];
  if (symbols.length > 1) {
    throw new Error('Those verification numbers come from different symbol columns ' +
      `(${symbols.join(', ')}), which never happens in a real puzzle. ` +
      'One of them is probably mistyped.');
  }

  const check = checkAssignment(deck, slots.map((s) => ({ cardId: s.cardId, variantIndex: s.variantIndex })));
  if (!check.ok) {
    throw new Error(check.reason === 'ambiguous'
      ? `That combination leaves ${check.count} possible codes, so something was entered wrong.`
      : 'No code satisfies all of those at once, so something was entered wrong.');
  }

  return {
    cardIds: slots.map((s) => s.cardId),
    variants: slots.map((s) => s.variantIndex),
    solution: check.solution,
    redundant: check.redundant,
    relaxed: check.redundant ? 'redundant' : null,
    official: true,
    symbol: symbols[0],
  };
}

/*
 * Parse a puzzle pasted straight off the turingmachine.info page. Selecting
 * their table gives one value per line:
 *
 *     a          A  9  785        A,9,785
 *     9    or    B  12 616   or   B,12,616
 *     785        ...              ...
 *
 * Slot letters are ignored — position is what counts. Any line carrying a
 * token that is neither a bare integer nor a single letter is dropped, which
 * throws away the page's headings and the "#B52 N7N 6" puzzle id.
 *
 * Card numbers (1-48) and verification numbers (201-798) occupy disjoint
 * ranges, so the two columns can be told apart and a reversed paste still
 * reads correctly.
 */
const CARD_MIN = 1, CARD_MAX = 48;
const VERIF_MIN = 201, VERIF_MAX = 798;

function parseOfficialPaste(text) {
  if (!text || !String(text).trim()) throw new Error('Paste the puzzle first.');

  const numbers = [];
  for (const line of String(text).split(/[\r\n]+/)) {
    const tokens = line.split(/[\s,;|\t]+/).filter(Boolean);
    if (!tokens.length) continue;
    const clean = tokens.map((t) => t.replace(/[.:)#]+$/, '').replace(/^[.:(#]+/, ''));
    if (!clean.every((t) => /^\d+$/.test(t) || /^[A-Za-z]$/.test(t))) continue;
    for (const t of clean) if (/^\d+$/.test(t)) numbers.push(parseInt(t, 10));
  }

  if (numbers.length < 8) {
    // People reach for the big heading first. It is a database row id, not an
    // encoding — the puzzle simply is not in it.
    var compact = String(text).replace(/[#\s]/g, '');
    if (/^[A-Za-z]\d[A-Za-z0-9]{3,8}$/.test(compact)) {
      throw new Error('That looks like the puzzle’s name (the “#B52 N7N 6” heading). ' +
        'It’s just an id — the puzzle isn’t stored in it. Copy the two columns of ' +
        'numbers underneath instead: the green criteria card number and the ' +
        'verification number beside it, for each of A, B, C…');
    }
    throw new Error('We could only find ' + numbers.length + ' number' +
      (numbers.length === 1 ? '' : 's') + ' in that. A puzzle needs a criteria card ' +
      'number and a verification number for each of its 4 to 6 verifiers.');
  }
  if (numbers.length % 2 !== 0) {
    throw new Error('That came to ' + numbers.length + ' numbers — an odd count, so one is ' +
      'missing or one too many got picked up. Each verifier needs exactly two.');
  }
  if (numbers.length > 12) {
    throw new Error('That came to ' + numbers.length + ' numbers, which is more than 6 ' +
      'verifiers worth. Paste just the puzzle’s own table.');
  }

  const isCard = (n) => n >= CARD_MIN && n <= CARD_MAX;
  const isVerif = (n) => n >= VERIF_MIN && n <= VERIF_MAX;

  const pairs = [];
  for (let i = 0; i < numbers.length; i += 2) {
    const a = numbers[i], b = numbers[i + 1];
    if (isCard(a) && isVerif(b)) pairs.push({ cardId: a, verification: b });
    else if (isVerif(a) && isCard(b)) pairs.push({ cardId: b, verification: a });
    else {
      const slot = 'ABCDEF'[pairs.length] || String(pairs.length + 1);
      throw new Error(`Couldn’t read ${slot}: “${a}” and “${b}” aren’t a criteria card ` +
        `(${CARD_MIN}-${CARD_MAX}) paired with a verification card (${VERIF_MIN}-${VERIF_MAX}).`);
    }
  }
  return pairs;
}

/* ---------- deduction / assist ---------- */

/**
 * Given the rounds played, which variants of each card are still possible?
 * A variant is impossible when it disagrees with any answer the machine gave.
 * results: [{ codeIndex, verifierSlot, answer(bool) }]
 */
function eliminatedVariants(deck, puzzle, results) {
  const dead = puzzle.cardIds.map((id) => new Array(deck.get(id).verifiers.length).fill(false));
  for (const r of results) {
    const card = deck.get(puzzle.cardIds[r.verifierSlot]);
    card.verifiers.forEach((v, vi) => {
      if (maskGet(v.mask, r.codeIndex) !== (r.answer ? 1 : 0)) dead[r.verifierSlot][vi] = true;
    });
  }
  return dead;
}

/**
 * Every code that is still a possible answer, given the observed results.
 * Considers only *legal* assignments (unique solution + no redundant card),
 * exactly as a careful player would.
 */
function candidateSolutions(deck, puzzle, results, legalAssignments) {
  const legal = legalAssignments || enumerateAssignments(deck, puzzle.cardIds,
    { allowRedundant: !!puzzle.redundant }).assignments;
  const cards = puzzle.cardIds.map((id) => deck.get(id));
  const alive = new Set();
  const survivors = [];
  outer:
  for (const a of legal) {
    for (const r of results) {
      const v = cards[r.verifierSlot].verifiers[a.variants[r.verifierSlot]];
      if (maskGet(v.mask, r.codeIndex) !== (r.answer ? 1 : 0)) continue outer;
    }
    survivors.push(a);
    alive.add(a.solutionIndex);
  }
  return {
    codes: [...alive].sort((x, y) => x - y).map(codeFromIndex),
    assignmentCount: survivors.length,
  };
}

/**
 * The candidate set after each answer in turn, so a player can replay how the
 * field narrowed. Index 0 is before any test; index i+1 is after results[i].
 *
 * Filters the surviving assignments forward rather than re-filtering the whole
 * legal set per step — answers only ever remove assignments, never restore
 * them, so each step starts from the last one's survivors.
 */
function candidateTimeline(deck, puzzle, results, legalAssignments) {
  const legal = legalAssignments || enumerateAssignments(deck, puzzle.cardIds,
    { allowRedundant: !!puzzle.redundant }).assignments;
  const cards = puzzle.cardIds.map((id) => deck.get(id));

  const snapshot = (alive) => {
    const seen = new Set();
    for (const a of alive) seen.add(a.solutionIndex);
    return {
      codes: [...seen].sort((x, y) => x - y).map(codeFromIndex),
      codeIndices: seen,
      assignmentCount: alive.length,
    };
  };

  let alive = legal;
  const steps = [snapshot(alive)];
  for (const r of results) {
    const want = r.answer ? 1 : 0;
    alive = alive.filter((a) =>
      maskGet(cards[r.verifierSlot].verifiers[a.variants[r.verifierSlot]].mask, r.codeIndex) === want);
    steps.push(snapshot(alive));
  }
  return steps;
}

/* ---------- exports ---------- */

const ENGINE = {
  N_CODES, ALL_CODES, codeIndex, codeFromIndex,
  maskNew, maskSet, maskGet, maskFull, maskAnd, maskOr, maskCount, maskFirst, maskToIndices,
  compileCriteria, validateDeck, MUTUALLY_EXCLUSIVE_UP_TO,
  checkAssignment, enumerateAssignments, generatePuzzle, MIN_SPREAD,
  generateColdPuzzle, coldness,
  encodePuzzle, decodePuzzle, decodeOfficial, parseOfficialPaste,
  eliminatedVariants, candidateSolutions, candidateTimeline,
  mulberry32, shuffled,
};

if (typeof module !== 'undefined' && module.exports) module.exports = ENGINE;
if (typeof window !== 'undefined') window.ENGINE = ENGINE;

/* ==========================================================================
   Icon language for the criteria cards.
   Turns the token arrays in data/visuals.json into inline SVG + chips,
   in the spirit of the printed cards: a shape per colour, numerals, signs.
   ========================================================================== */

(function () {
  'use strict';

  var SHAPES = {
    blue:   '<path d="M11 2.2 19.6 18.4H2.4Z"/>',
    yellow: '<rect x="2.8" y="2.8" width="16.4" height="16.4" rx="1.6"/>',
    purple: '<circle cx="11" cy="11" r="8.6"/>'
  };
  var ORDER = ['blue', 'yellow', 'purple'];

  function svg(inner, cls) {
    return '<svg class="gl-svg ' + (cls || '') + '" viewBox="0 0 22 22" aria-hidden="true">' + inner + '</svg>';
  }

  function shape(colour) {
    return '<span class="gl-shape gl-' + colour + '">' + svg(SHAPES[colour]) + '</span>';
  }

  /* "the others" — the remaining digits, whichever colours they turn out to be */
  function others() {
    return '<span class="gl-others" aria-hidden="true">' +
      svg('<path d="M11 2.2 19.6 18.4H2.4Z"/>') +
      svg('<rect x="2.8" y="2.8" width="16.4" height="16.4" rx="1.6"/>') +
      svg('<circle cx="11" cy="11" r="8.6"/>') +
      '</span>';
  }

  /* "a specific colour" — the three shapes offered as a choice */
  function anyColour() {
    return '<span class="gl-any">' + ORDER.map(shape).join('') + '</span>';
  }

  /* Separated bars mean ordering — 1 then 3 then 5 counts as ascending.
     Blocks butted into a staircase mean a consecutive run — only 3,4,5 does.
     The two must never look alike: they are different cards. */
  function bars(n, dir, tight) {
    var hs = dir === 'up' ? [7, 12, 17] : dir === 'down' ? [17, 12, 7] : [13, 7, 16];
    var w = tight ? 6.2 : 4.6;
    var step = tight ? 6.2 : 6.6;
    var out = '';
    for (var i = 0; i < n; i++) {
      var h = hs[i];
      // No separator between run blocks: they must fuse into one solid
      // staircase. A hairline here survives magnification but not the 15px
      // the options list actually renders at, leaving it a lookalike of the
      // separated bars that mean something else entirely.
      out += '<rect x="' + (2 + i * step) + '" y="' + (20 - h) + '" width="' + w + '" height="' + h +
        '" rx="' + (tight ? 0 : 1) + '"/>';
    }
    if (tight) out += '<rect x="1.4" y="19.4" width="' + (1.2 + n * step) + '" height="1.6" rx=".8"/>';
    return svg(out, 'gl-bars');
  }

  /* repeated digits, for pairs and triples */
  function repeat(n) {
    var out = '';
    for (var i = 0; i < n; i++) out += '<circle cx="' + (4.5 + i * 6.5) + '" cy="11" r="3.1"/>';
    return svg(out, 'gl-repeat');
  }

  var FIGURES = {
    others: others,
    anycolour: anyColour,
    asc2: function () { return '<span class="gl-fig">' + bars(2, 'up') + '</span>'; },
    asc3: function () { return '<span class="gl-fig">' + bars(3, 'up') + '</span>'; },
    desc2: function () { return '<span class="gl-fig">' + bars(2, 'down') + '</span>'; },
    desc3: function () { return '<span class="gl-fig">' + bars(3, 'down') + '</span>'; },
    run2:  function () { return '<span class="gl-fig">' + bars(2, 'up', true) + '</span>'; },
    run3:  function () { return '<span class="gl-fig">' + bars(3, 'up', true) + '</span>'; },
    rund2: function () { return '<span class="gl-fig">' + bars(2, 'down', true) + '</span>'; },
    rund3: function () { return '<span class="gl-fig">' + bars(3, 'down', true) + '</span>'; },
    noorder: function () { return '<span class="gl-fig">' + bars(3, 'none') + '</span>'; },
    double: function () { return '<span class="gl-fig">' + repeat(2) + '</span>'; },
    triple: function () { return '<span class="gl-fig">' + repeat(3) + '</span>'; },
    slash: function () {
      return '<span class="gl-fig gl-none">' + svg(
        '<circle cx="11" cy="11" r="8.4" fill="none" stroke="currentColor" stroke-width="2.2"/>' +
        '<line x1="5" y1="17" x2="17" y2="5" stroke="currentColor" stroke-width="2.2"/>') + '</span>';
    }
  };

  function token(t) {
    if (t.s) return shape(t.s);
    if (t.n !== undefined) return '<span class="gl-num">' + t.n + '</span>';
    if (t.o) return '<span class="gl-op">' + escapeOp(t.o) + '</span>';
    if (t.k === 'sum') return '<span class="gl-sum">&Sigma;</span>';
    if (t.w) return '<span class="gl-word">' + t.w + '</span>';
    if (t.g) return (FIGURES[t.g] || function () { return ''; })();
    if (t.c !== undefined) {
      return '<span class="gl-count"><span class="gl-times">' +
        '&times;' + (t.c === '?' ? '?' : t.c) + '</span>' + token(t.of) + '</span>';
    }
    return '';
  }

  function escapeOp(o) {
    return o === '<' ? '&lt;' : o === '>' ? '&gt;' : o;
  }

  /**
   * render(tokens, size) -> HTML string.
   * size: 'lg' for a card face, 'sm' for an option in the notes list.
   */
  function render(tokens, size) {
    if (!tokens || !tokens.length) return '';
    return '<span class="glyphs gl-' + (size || 'lg') + '" aria-hidden="true">' +
      tokens.map(token).join('') + '</span>';
  }

  window.GLYPHS = { render: render };
})();

  function isCold() { return !!(S.puzzle && S.puzzle.cold); }

  /* Options lists start closed in normal play and open in No-questions mode,
     where they are the whole working surface. Both defaults are "no entry yet",
     so the toggle has to flip the state actually on screen — otherwise the
     first click on an open-by-default list writes `true` and appears dead. */
  function notesOpen(slot) {
    var v = S.openNotes[slot];
    return isCold() ? v !== false : !!v;
  }

  function currentRound() { return S.rounds.length ? S.rounds[S.rounds.length - 1] : null; }

  function activeRound() { return S.pendingRound ? null : currentRound(); }

  function testsThisRound() {
    var r = activeRound();
    return r ? r.tests.length : 0;
  }

  function roundLocked() {
    var r = activeRound();
    return !!(r && r.tests.length);
  }

  /* Every answer in the order it was given, carrying the round and proposal
     that produced it — the log needs that to caption the replay. */
  function resultTrail() {
    var out = [];
    S.rounds.forEach(function (r, ri) {
      r.tests.forEach(function (t) {
        out.push({
          codeIndex: E.codeIndex(r.code[0], r.code[1], r.code[2]),
          verifierSlot: t.slot,
          answer: t.answer,
          round: ri + 1,
          final: !!r.final,
          code: r.code
        });
      });
    });
    return out;
  }

  function allResults() {
    var out = [];
    S.rounds.forEach(function (r) {
      r.tests.forEach(function (t) {
        out.push({ codeIndex: E.codeIndex(r.code[0], r.code[1], r.code[2]), verifierSlot: t.slot, answer: t.answer });
      });
    });
    return out;
  }

  /*
   * Ask before doing something that cannot be undone.
   *
   * Deliberately not window.confirm: published as an artifact this page runs
   * inside a sandboxed frame, where confirm() is ignored and returns false —
   * so the action silently never happened and the button looked broken. An
   * in-app dialog also matches the rest of the interface.
   */
  function ask(spec) {
    S.ask = spec;
    S.modal = 'ask';
    render();
  }

  function toast(msg) {
    S.toast = msg;
    render();
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { S.toast = null; render(); }, 2200);
  }

  /* --------------------------------------------------------- persistence */

  var LAST_KEY = 'turing:v1:last';

  function storeKey() { return 'turing:v1:' + S.shareCode; }

  function save() {
    if (!S.shareCode) return;
    try {
      localStorage.setItem(storeKey(), JSON.stringify({
        rounds: S.rounds, notes: S.notes, assist: S.assist, pendingRound: S.pendingRound,
        attempts: S.attempts, grid: S.grid, gridOpen: S.gridOpen, coldMiss: S.coldMiss,
        finished: S.finished, proposal: S.proposal, openNotes: S.openNotes
      }));
    } catch (e) { /* private browsing — play on without saving */ }
  }

  function restore() {
    try {
      var raw = localStorage.getItem(storeKey());
      if (!raw) return false;
      var d = JSON.parse(raw);
      S.rounds = d.rounds || [];
      S.notes = d.notes || {};
      S.assist = d.assist || 'off';
      S.finished = d.finished || null;
      S.proposal = d.proposal || [1, 1, 1];
      S.openNotes = d.openNotes || {};
      S.pendingRound = !!d.pendingRound;
      S.attempts = d.attempts || [];
      S.grid = d.grid || {};
      S.gridOpen = !!d.gridOpen;
      S.coldMiss = d.coldMiss || null;
      return true;
    } catch (e) { return false; }
  }

  /* -------------------------------------------------------------- assist */

  function ensureLegal() {
    if (S.legal) return S.legal;
    try {
      S.legal = E.enumerateAssignments(DECK, S.puzzle.cardIds,
        { allowRedundant: !!S.puzzle.redundant }).assignments;
    } catch (e) { S.legal = []; }
    return S.legal;
  }

  function autoStruck() {
    if (S.assist === 'off' && !S.finished) return null;
    return E.eliminatedVariants(DECK, S.puzzle, allResults());
  }

  /* ================================================================ SETUP */

    out += '<div class="setup-grid">';

    out += '<section class="panel"><div class="panel-head"><h3 class="panel-title">Build a machine</h3></div><div class="panel-body">';

        }).join('') + '</div></div>';

      out += '<p class="hint" style="font-size:13px">' + (
        st.coldLevel === 'gentle'
          ? 'Only cards <b>1&ndash;25</b>, where each card\'s options are mutually exclusive — ' +
            'if one holds, the rest cannot. That is the reasoning most people find natural, and ' +
            'it keeps the number of settings you have to rule out down to a dozen or so.'
        : st.coldLevel === 'tough'
          ? 'At least three cards from <b>26&ndash;48</b>, where a card offers a <em>menu</em> of ' +
            'separate criteria and several can be true of one code at once. Expect a few hundred ' +

          : 'Any card. Usually a couple from 26&ndash;48, where several options can be true of the ' +

      out += '<div class="field"><label>How many cards</label><div class="seg" role="group">' +

          return '<button type="button" data-action="count" data-n="' + n + '" aria-pressed="' +

        }).join('') + '</div></div>';
      out += '<p class="hint" style="font-size:13px">Fewer cards is not simpler here — with four, ' +
        'each one carries more of the work.</p>';
    } else if (st.mode === 'official') {
      out += '<p class="hint" style="margin-top:0">Copy a puzzle straight off ' +
        '<b>turingmachine.info</b> — the Daily Challenge, or any puzzle it generates. ' +

        '<em>verification card</em> number beside it. That second number is the secret half, ' +
        'so the app reproduces the exact puzzle the site set.</p>';

      out += '<div class="paste-box"><div class="field" style="margin-bottom:0">' +
        '<label>Paste it in</label>' +
        '<textarea class="input" data-action="paste-in" rows="5" spellcheck="false" ' +
        'placeholder="a&#10;9&#10;785&#10;b&#10;12&#10;616&#10;&#8230;">' + h(st.paste) + '</textarea>' +
        '</div><div class="paste-actions">' +
        '<button class="btn btn-sm" data-action="read-paste">Read it in</button>' +
        '<span class="hint" style="font-size:12.5px">Select the table on the site and paste — ' +
        'headings and the puzzle number are ignored.</span>' +
        '</div></div>';

      out += '<div class="official-grid"><div class="official-head">' +
        '<span></span><span>Criteria card</span><span>Verification card</span><span></span></div>' +
        st.official.map(function (row, i) {
          return '<div class="official-row">' +
            '<span class="official-letter">' + LETTERS[i] + '</span>' +
            '<input class="input" inputmode="numeric" data-action="official-in" data-i="' + i + '" data-k="0"' +
              ' value="' + h(row[0]) + '" placeholder="1-48" autocomplete="off">' +
            '<input class="input" inputmode="numeric" data-action="official-in" data-i="' + i + '" data-k="1"' +
              ' value="' + h(row[1]) + '" placeholder="201-798" autocomplete="off">' +
            (st.official.length > 4
              ? '<button class="official-drop" data-action="official-row" data-d="-1" data-i="' + i + '"' +
                ' aria-label="Remove verifier ' + LETTERS[i] + '">&times;</button>'
              : '<span></span>') +
            '</div>';
        }).join('') + '</div>';

      if (st.official.length < 6) {
        out += '<button class="btn btn-sm btn-ghost" style="margin-top:10px" ' +
          'data-action="official-row" data-d="1">+ Add a verifier</button>';
      }
      out += '<p class="hint" style="margin-top:14px;font-size:13px">Nobody has to look anything up ' +
        'in the box, and reading these numbers out loud spoils nothing — they mean nothing without ' +

    } else if (st.mode === 'random') {
      out += '<div class="field"><label>How many verifiers</label><div class="seg" role="group">' +
